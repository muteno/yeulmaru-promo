name: 앱 문서→마크다운 변환 (anydoc · repository_dispatch)

# 앱(index.html ▸ 콘텐츠 제작 ▸ 문서 → 마크다운)이 Worker /api/anydoc/dispatch 로 던지면
# firecrawl/anydoc 이 문서를 GitHub-Flavored Markdown 으로 바꿔 결과를 커밋한다.
# 구조·계약 = office-edit.yml 미러 — 다른 건 셋뿐:
#   ① AI 미사용 — claude -p·OAuth 시크릿 체인·계정 승격 단계가 없다(변환은 지시가 필요 없는 결정적 작업).
#   ② 결과가 텍스트(.md) — 확장자가 언제나 하나라 앱은 /api/anydoc/file 로 통짜 텍스트를 받는다.
#   ③ 입력 확장자 21종(anydoc README 지원표) — Worker 화이트리스트와 같은 목록.
#
#  입력 : drafts/anydoc/<id>.in.<ext>   (Worker /api/anydoc/upload 가 미리 커밋)
#  출력 : drafts/anydoc/<id>.out.md     (앱이 /api/anydoc/file 로 수령)
#         drafts/<id>.json              (앱 폴링 = 블로그·한글문서·오피스와 같은 /api/blog/draft 경로 재사용)
#
# 엔진: https://github.com/firecrawl/anydoc (MIT) — Rust 라이브러리 + NAPI 바이너리.
#   ⚠️ WASM·브라우저 빌드가 없다(npm 패키지 = 플랫폼별 .node optionalDependencies · engines node>=20).
#      그래서 온디바이스로 못 하고 이 러너를 지난다.
#   CLI 계약(README 실측): `anydoc <파일>` = 마크다운을 stdout 으로 · `-o <파일>` = 파일로.
#      여기선 -o 를 쓰고, 산출이 비면 stdout 경로로 한 번 더 시도한다(업스트림 플래그가 바뀌어도 안 죽게).

on:
  repository_dispatch:
    types: [anydoc-convert]

permissions:
  contents: write

concurrency:
  group: anydoc-convert
  cancel-in-progress: false

env:
  ANYDOC_VERSION: '0.1.3'   # 변환 엔진 고정 버전 — 업스트림이 깨지면 여기만 내린다(office-edit.yml 의 OFFICECLI_VERSION 과 같은 축)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # 변환은 초 단위 — 러너 시작·설치 여유만 두고 프론트 폴 한도(5분)보다 길게
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'   # anydoc engines: node >= 20
      - name: anydoc 준비 (버전 핀)
        run: |
          set -e
          npm install -g "@firecrawl/anydoc@${ANYDOC_VERSION}"
          anydoc --version || true
          echo "anydoc 준비 완료"
      - name: 문서 변환
        uses: actions/github-script@v7
        with:
          retries: 3
          script: |
            const { execFileSync } = require('child_process');
            const fs = require('fs');
            const path = require('path');
            const _cp = context.payload.client_payload || {};
            const p = (_cp && typeof _cp.d === 'object' && _cp.d) ? _cp.d : _cp;
            const id = String(p.id || '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 80) || ('x' + Date.now());
            const ext = ((String(p.ext || '').toLowerCase().match(/^(doc|docx|docm|ppt|pps|pot|pptx|pptm|ppsx|ppsm|xls|xlsx|xlsm|xlsb|odt|ods|odp|rtf|epub|csv|pdf)$/) || [])[1]) || '';
            const docName = String(p.name || ('문서.' + (ext || 'docx'))).slice(0, 160);
            const work = process.env.RUNNER_TEMP;
            const inRepo = 'drafts/anydoc/' + id + '.in.' + ext;

            fs.mkdirSync('drafts/anydoc', { recursive: true });
            const fail = (msg) => {
              fs.writeFileSync('drafts/' + id + '.json', JSON.stringify({ id, mode: 'anydoc', ok: false, error: String(msg).slice(0, 600), ts: new Date().toISOString() }));
            };

            // ---- 원본 확보 (업로드 커밋과의 레이스 대비 — 없으면 리베이스 후 재시도. office-edit.yml 과 같은 축) ----
            let srcBuf = null;
            if (ext) {
              for (let i = 0; i < 4 && !srcBuf; i++) {
                if (fs.existsSync(inRepo)) { srcBuf = fs.readFileSync(inRepo); break; }
                try { execFileSync('git', ['pull', '--rebase', 'origin', 'main'], { stdio: 'ignore' }); } catch (e) {}
              }
            }

            if (!ext) { fail('지원하지 않는 형식이에요'); }
            else if (!srcBuf) { fail('원본 문서를 찾지 못했어요(' + inRepo + ')'); }
            else {
              const target = path.join(work, 'input.' + ext);
              const outPath = path.join(work, 'output.md');
              fs.writeFileSync(target, srcBuf);

              let md = '', err = '';
              // ① 파일 산출(-o) — README 의 기본 사용법
              try {
                execFileSync('anydoc', [target, '-o', outPath], { stdio: ['ignore', 'inherit', 'pipe'], timeout: 5 * 60e3 });
                if (fs.existsSync(outPath)) md = fs.readFileSync(outPath, 'utf8');
              } catch (e) { err = String((e && e.stderr && e.stderr.toString()) || (e && e.message) || e).slice(0, 600); }
              // ② stdout 폴백 — -o 가 없어지거나 산출이 비면 여기로(업스트림 플래그 변화 방어)
              if (!md.trim()) {
                try {
                  md = execFileSync('anydoc', [target], { encoding: 'utf8', maxBuffer: 64 * 1024 * 1024, timeout: 5 * 60e3 });
                } catch (e) { if (!err) err = String((e && e.stderr && e.stderr.toString()) || (e && e.message) || e).slice(0, 600); }
              }

              if (!md || !md.trim()) {
                fail('마크다운으로 바꾸지 못했어요' + (err ? ' — ' + err : ''));
              } else {
                const outRepo = 'drafts/anydoc/' + id + '.out.md';
                fs.writeFileSync(outRepo, md);
                const outName = docName.replace(/\.[^.]+$/, '') + '.md';
                fs.writeFileSync('drafts/' + id + '.json', JSON.stringify({
                  id, mode: 'anydoc', ok: true, name: outName, path: outRepo,
                  bytes: Buffer.byteLength(md), chars: md.length, ts: new Date().toISOString()
                }));
              }
            }

            // ---- 원본 회수 + 묵은 산출물 정리 (id 안의 타임스탬프 기준 — checkout mtime 은 신뢰 불가) ----
            try { if (fs.existsSync(inRepo)) fs.unlinkSync(inRepo); } catch (e) {}
            try {
              const now = Date.now();
              for (const f of fs.readdirSync('drafts/anydoc')) {
                const mm = f.match(/^ad(\d+)\.(in|out)\./);
                if (!mm) continue;
                // 원본(.in)은 1시간 · 결과(.out)는 3일 뒤 회수 — 남의 문서가 레포에 오래 남지 않게(hwp·office 와 동일).
                const ttl = (mm[2] === 'in') ? 3600e3 : 3 * 86400e3;
                if (now - Number(mm[1]) > ttl) { try { fs.unlinkSync(path.join('drafts/anydoc', f)); } catch (e) {} }
              }
              for (const f of fs.readdirSync('drafts')) {
                const mm = f.match(/^ad(\d+)\.json$/);
                if (mm && f !== id + '.json' && now - Number(mm[1]) > 3 * 86400e3) { try { fs.unlinkSync(path.join('drafts', f)); } catch (e) {} }
              }
            } catch (e) {}

            execFileSync('git', ['config', 'user.name', 'github-actions[bot]']);
            execFileSync('git', ['config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com']);
            execFileSync('git', ['add', '-A', 'drafts']);
            execFileSync('git', ['commit', '-m', 'chore(anydoc): ' + id + ' [skip ci]']);
            let pushed = false;
            for (let i = 0; i < 6; i++) {
              try { execFileSync('git', ['push', 'origin', 'HEAD:main']); pushed = true; break; }
              catch (e) { try { execFileSync('git', ['pull', '--rebase', 'origin', 'main']); } catch (e2) {} }
            }
            if (!pushed) core.setFailed('push 실패');
