name: 앱 한글문서 편집 (claude -p · repository_dispatch)

# 앱(index.html ▸ 콘텐츠 제작 ▸ 한글문서 편집)이 Worker /api/hwp/dispatch 로 던지면
# claude -p(구독 OAuth 5계정 체인)가 claw-hwp 「hwp」 스킬로 문서를 고쳐 결과를 커밋한다.
#
#  입력 : drafts/hwp/<id>.in.<ext>   (Worker /api/hwp/upload 가 미리 커밋)
#  출력 : drafts/hwp/<id>.out.<ext>  (앱이 /api/hwp/file 로 수령)
#         drafts/<id>.json           (앱 폴링 = 블로그와 같은 /api/blog/draft 경로 재사용)
#
# 모델(운영자 260803 지시): claude-opus-5 · --effort medium.
# 편집 엔진: https://github.com/DoHyun468/claw-hwp (MIT) 의 skills/hwp — 러너에 그대로 복사해
#   프로젝트 스킬(.claude/skills/hwp)로 얹는다. 스킬의 node/python 스크립트는 의존성이 vendor 되어 있어
#   npm install 이 필요 없다(claw-hwp scripts/README "no setup needed" — 260803 로컬 실측 확인).
#   ⚠️ 플러그인 설치(claude plugin install) 대신 스킬 복사를 쓰는 이유 = 헤드리스에서 마켓플레이스 신뢰
#   프롬프트에 걸릴 여지를 없애고, 버전을 이 워크플로가 고정(ref)할 수 있게 하려는 것.
# 브라우저 미리보기(hwp/viewer-core.js)는 같은 저장소의 rhwp 렌더러 이식본 — hwp/NOTICE.md 참조.

on:
  repository_dispatch:
    types: [hwp-edit]

permissions:
  contents: write

concurrency:
  group: hwp-edit
  cancel-in-progress: false

env:
  CLAW_HWP_REF: main   # claw-hwp 고정 ref — 업스트림이 깨지면 여기를 태그로 고정해 되돌린다

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # 에이전트 왕복(문서 읽기 → 편집 op → 검증) 여유 + 프론트 폴 한도(12분)보다 길게
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: claw-hwp 스킬 준비
        run: |
          set -e
          git clone --depth 1 --branch "$CLAW_HWP_REF" https://github.com/DoHyun468/claw-hwp.git "$RUNNER_TEMP/claw-hwp"
          mkdir -p "$RUNNER_TEMP/hwpwork/.claude/skills"
          cp -r "$RUNNER_TEMP/claw-hwp/plugins/claw-hwp/skills/hwp" "$RUNNER_TEMP/hwpwork/.claude/skills/hwp"
          test -f "$RUNNER_TEMP/hwpwork/.claude/skills/hwp/scripts/create.js"
          echo "claw-hwp 스킬 준비 완료"
      - name: 문서 수정 (claude -p)
        uses: actions/github-script@v7
        env:
          # 계정 선택 = ACTIVE_ACCOUNT 부터 체인 순환(shared/claude_failover.js) — nb-blog.yml 과 같은 시크릿 세트.
          ACTIVE_ACCOUNT: ${{ vars.ACTIVE_ACCOUNT || 'EMS1130G' }}
          ACC_EMS1130G: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_EMS1130G }}
          ACC_EMS1130N: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_EMS1130N }}
          ACC_MUTENO: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_MUTENO }}
          ACC_MUTENONA: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_MUTENONA }}
          ACC_NOMUTEFB: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_NOMUTEFB }}
        with:
          retries: 3
          script: |
            const { execFileSync } = require('child_process');
            const fs = require('fs');
            const path = require('path');
            const _cp = context.payload.client_payload || {};
            const p = (_cp && typeof _cp.d === 'object' && _cp.d) ? _cp.d : _cp;
            const id = String(p.id || '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 80) || ('x' + Date.now());
            const ext = (String(p.ext || '').toLowerCase() === 'hwpx') ? 'hwpx' : 'hwp';
            const ask = String(p.ask || '').slice(0, 4000).trim();
            const docName = String(p.name || ('문서.' + ext)).slice(0, 160);
            const work = path.join(process.env.RUNNER_TEMP, 'hwpwork');
            const inRepo = 'drafts/hwp/' + id + '.in.' + ext;

            fs.mkdirSync('drafts/hwp', { recursive: true });
            const fail = (msg) => {
              fs.writeFileSync('drafts/' + id + '.json', JSON.stringify({ id, mode: 'hwp', ok: false, error: String(msg).slice(0, 600), ts: new Date().toISOString() }));
            };

            // ---- 원본 확보 (업로드 커밋과의 레이스 대비 — 없으면 리베이스 후 재시도) ----
            let srcBuf = null;
            for (let i = 0; i < 4 && !srcBuf; i++) {
              if (fs.existsSync(inRepo)) { srcBuf = fs.readFileSync(inRepo); break; }
              try { execFileSync('git', ['pull', '--rebase', 'origin', 'main'], { stdio: 'ignore' }); } catch (e) {}
            }

            if (!ask) { fail('수정 요청이 비어 있어요'); }
            else if (!srcBuf) { fail('원본 문서를 찾지 못했어요(' + inRepo + ')'); }
            else {
              const target = path.join(work, 'input.' + ext);
              fs.writeFileSync(target, srcBuf);
              const outPath = path.join(work, 'output.' + ext);
              const skill = path.join(work, '.claude', 'skills', 'hwp');

              // ---- 프롬프트 — 도구를 쓰는 편집 작업이라 nb-blog(1턴 텍스트 생성)와 계약이 다르다 ----
              let prompt = '';
              prompt += '너는 한글문서(.hwp/.hwpx)를 다루는 편집 담당이다. 아래 문서를 사용자의 요청대로 고쳐서 저장해라.\n\n';
              prompt += '# 파일\n';
              prompt += '- 원본: ' + target + ' (원래 파일 이름 「' + docName + '」)\n';
              prompt += '- 결과: ' + outPath + ' — 반드시 이 경로에 저장한다(형식은 원본과 같은 .' + ext + ' 유지, 포맷 변환 금지).\n';
              prompt += '- 편집 도구: ' + skill + '/SKILL.md 의 「hwp」 스킬. 스크립트는 ' + skill + '/scripts/ 에 있고 의존성이 이미 vendor 되어 있다 — npm install 하지 마라.\n\n';
              prompt += '# 사용자 요청\n' + ask + '\n\n';
              prompt += '# 작업 순서\n';
              prompt += '1. 먼저 ' + skill + '/SKILL.md 를 읽고 이 포맷(.' + ext + ')의 편집 경로를 확인한다.\n';
              prompt += '2. `node ' + skill + '/scripts/extract_text.js <파일> --inspect` 등으로 문서의 실제 내용·표 구조를 확인한다. 원본을 안 보고 고치지 마라.\n';
              prompt += '3. 원본을 ' + outPath + ' 로 복사한 뒤 그 사본에만 편집 op 를 적용한다(원본 파일은 그대로 둔다).\n';
              prompt += '4. 편집은 한 번에 몰아서(operations 배열 하나) 실행한다 — 칸마다 따로 호출하지 마라.\n';
              prompt += '5. 끝나면 결과 파일을 다시 읽어 요청이 실제로 반영됐는지 확인한다. 반영이 안 됐으면 다른 op 로 다시 시도한다(표 안의 글자는 replace_text 가 아니라 셀 편집 op 가 필요할 수 있다).\n\n';
              prompt += '# 규칙\n';
              prompt += '- 요청한 부분만 고친다. 서식·표·이미지·여백 등 나머지는 건드리지 않는다.\n';
              prompt += '- 문서에 없는 사실(날짜·금액·이름)을 지어내지 않는다. 요청이 모호하면 가장 보수적으로 해석한다.\n';
              prompt += '- 인터넷 검색·외부 전송은 하지 않는다. 문서 내용을 이 작업 밖으로 내보내지 않는다.\n';
              prompt += '- 마지막 줄에 「===SUMMARY===」 를 쓰고 그 다음 줄에 무엇을 바꿨는지 한국어 한 문장으로 적는다(예: 예산을 오천만원으로, 기간을 9월까지로 고쳤어요).\n';

              const args = ['-p', '--model', 'claude-opus-5', '--effort', 'medium', '--max-turns', '40',
                            '--allowedTools', 'Bash,Read,Write,Edit,Glob,Grep,Skill'];
              const { runClaudeWithFailover } = require(path.join(process.env.GITHUB_WORKSPACE, 'shared/claude_failover.js'));
              const _r = runClaudeWithFailover({ args, input: prompt, cwd: work });
              const raw = _r.ok ? String(_r.raw || '') : '';
              let summary = '';
              const m = raw.split(/^===SUMMARY===\s*$/m);
              if (m.length > 1) summary = String(m[m.length - 1] || '').trim().split('\n')[0].slice(0, 200);
              if (!summary) summary = raw.trim().split('\n').filter(Boolean).pop() || '';

              // ---- 결과 확인 → 커밋 ----
              if (!fs.existsSync(outPath) || fs.statSync(outPath).size < 512) {
                fail(_r.ok ? ('수정본이 만들어지지 않았어요' + (summary ? ' — ' + summary : '')) : (_r.error || '실행 실패'));
              } else {
                const outRepo = 'drafts/hwp/' + id + '.out.' + ext;
                fs.copyFileSync(outPath, outRepo);
                const outName = docName.replace(/(\.hwpx?)$/i, '') + '_수정본.' + ext;
                fs.writeFileSync('drafts/' + id + '.json', JSON.stringify({
                  id, mode: 'hwp', ok: true, name: outName, path: outRepo,
                  bytes: fs.statSync(outRepo).size, summary, ts: new Date().toISOString()
                }));
              }
            }

            // ---- 원본 회수 ----
            try { if (fs.existsSync(inRepo)) fs.unlinkSync(inRepo); } catch (e) {}
            // ---- 산출물 회수 — 기능별 **최근 3개**만 남긴다(공용 회수기 `shared/drafts_retain.mjs`) ----
            // ⚠️ 구 방식(id에 박힌 시각 TTL)은 두 군데서 실패해 왔다: nb는 아예 무접촉이었고, `(\d+)`가 16자리
            //    id를 통째로 잡아 비교가 늘 음수라 회수가 한 번도 안 돌았다. 개수 기준은 그 함정을 안 밟는다.
            //    이 레포는 공개 레포라 남겨 두는 개수 = 노출 면적이다(상세 = shared/drafts_retain.mjs 머리말).
            try {
              const { retainDrafts } = await import('file://' + path.join(process.env.GITHUB_WORKSPACE, 'shared/drafts_retain.mjs'));
              const rr = retainDrafts({ root: process.env.GITHUB_WORKSPACE, keep: 3, protect: id });
              core.info('[drafts] 회수 ' + rr.removed.length + '건 · 기능별 최근 ' + rr.keep + '건 유지');
            } catch (e) { core.warning('[drafts] 회수 건너뜀: ' + e.message); }

            execFileSync('git', ['config', 'user.name', 'github-actions[bot]']);
            execFileSync('git', ['config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com']);
            execFileSync('git', ['add', '-A', 'drafts']);
            execFileSync('git', ['commit', '-m', 'chore(hwp): ' + id + ' [skip ci]']);
            let pushed = false;
            for (let i = 0; i < 6; i++) {
              try { execFileSync('git', ['push', 'origin', 'HEAD:main']); pushed = true; break; }
              catch (e) { try { execFileSync('git', ['pull', '--rebase', 'origin', 'main']); } catch (e2) {} }
            }
            if (!pushed) core.setFailed('push 실패');

      # 활성 계정이 이번 런에 쿼터로 폴오버됐으면 누적 → 다음 계정으로 자동 전진(nb-blog.yml 과 같은 축).
      - name: 활성 계정 자동 승격(쿼터 누적 시)
        if: always()
        env:
          GH_VARS_TOKEN: ${{ secrets.GH_VARS_TOKEN }}
          ACTIVE_ACCOUNT: ${{ vars.ACTIVE_ACCOUNT || 'EMS1130G' }}
        run: python3 shared/account_failover.py
