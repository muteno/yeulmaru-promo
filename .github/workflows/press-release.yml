name: 앱 보도자료 만들기 (claude -p · repository_dispatch)

# 앱(index.html ▸ 콘텐츠 제작 ▸ 보도자료 만들기)이 Worker /api/press/dispatch 로 던지면
# claude -p(구독 OAuth 5계정 체인)가 보도자료 본문을 쓰고, tools/press_docx.py 가 워드로 조립해 커밋한다.
#
#  입력 : client_payload.d = { id, tone, perfs[], hooks[], main, srcs[], prevDraft, revise }
#         drafts/press/<id>.src<N>.<ext>   (Worker /api/press/upload 가 미리 커밋한 자료 원본 · 선택)
#  출력 : drafts/press/<id>.out.docx       (앱이 /api/press/file 로 수령)
#         drafts/<id>.json                 (앱 폴링 = 블로그·오피스와 같은 /api/blog/draft 경로 재사용)
#
# 구조 = nb-blog.yml(리서치 있는 집필) + office-edit.yml(파일 산출) 두 정본의 합. 신설 개념 0.
#
# 모델: claude-opus-5 · --effort max (운영자 260806-3 「오퍼스 5 노력도 최대」). nb-blog 새 초안과 같은 축.
# 리서치: WebSearch·WebFetch 허용 — 공연 상세는 앱이 이미 읽어 보내지만, 출연자·작품 교차 확인은 여기서 한다.
#
# ⚠ 사진은 러너로 안 올린다. 이 레포는 **공개**라 행사 사진을 커밋하면 그게 곧 노출이다.
#   운영자 요구(260806-3 「빈 공간에 사진도 넣을 수 있도록 완성된 워드」)는 **워드 안의 빈 액자**로 푼다 —
#   press_docx.py 가 사진 자리마다 점선 액자 + 캡션 초안을 넣어 두고, 사람은 워드에서 [삽입 ▸ 그림]만 하면 된다.
#   (press_docx.py 는 사진 삽입도 할 줄 안다. 나중에 비공개 경로가 생기면 그때 배선한다.)

on:
  repository_dispatch:
    types: [press-release]

permissions:
  contents: write

concurrency:
  group: press-release
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 32   # effort max + 멀티턴 리서치 + 워드 조립. 프론트 폴 한도(30분)보다 길게.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: 조립기 준비 (python-docx · olefile · pdftotext)
        run: |
          set -e
          python3 -m pip install --quiet 'python-docx==1.2.0' 'olefile==0.47'
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          python3 -c "import docx, olefile; print('docx/olefile ok')"
          pdftotext -v 2>&1 | head -1

      - name: 보도자료 작성 (claude -p)
        uses: actions/github-script@v7
        env:
          ACTIVE_ACCOUNT: ${{ vars.ACTIVE_ACCOUNT || 'EMS1130G' }}
          ACC_EMS1130G: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_EMS1130G }}
          ACC_EMS1130N: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_EMS1130N }}
          ACC_MUTENO: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_MUTENO }}
          ACC_MUTENONA: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_MUTENONA }}
          ACC_NOMUTEFB: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_NOMUTEFB }}
        with:
          retries: 3
          script: |
            const { execFileSync } = require('child_process');
            const fs = require('fs');
            const path = require('path');
            const _cp = context.payload.client_payload || {};
            const p = (_cp && typeof _cp.d === 'object' && _cp.d) ? _cp.d : _cp;
            const id = String(p.id || '').replace(/[^A-Za-z0-9_-]/g, '').slice(0, 80) || ('x' + Date.now());
            const tone = String(p.tone || 'press') === 'blog' ? 'blog' : 'press';
            const perfs = Array.isArray(p.perfs) ? p.perfs.slice(0, 12) : [];
            const hooks = (Array.isArray(p.hooks) ? p.hooks : []).map(s => String(s || '').trim()).filter(Boolean).slice(0, 6);
            const mainName = String(p.main || '').trim();
            const revise = String(p.revise || '').slice(0, 4000).trim();
            const prevDraft = String(p.prevDraft || '').slice(0, 60000).trim();
            const work = process.env.RUNNER_TEMP || '/tmp';

            fs.mkdirSync('drafts/press', { recursive: true });
            const fail = (msg) => fs.writeFileSync('drafts/' + id + '.json', JSON.stringify({
              id, mode: 'press', ok: false, error: String(msg).slice(0, 600), ts: new Date().toISOString()
            }));

            // ---- 첨부 자료 텍스트화 (있으면) — 업로드 커밋과의 레이스 대비 리베이스 재시도(office-edit 계약 계승) ----
            let srcNote = '';
            const srcFiles = [];
            for (let i = 0; i < 6; i++) {
              const g = fs.existsSync('drafts/press') ? fs.readdirSync('drafts/press').filter(f => f.startsWith(id + '.src')) : [];
              if (g.length) { g.forEach(f => srcFiles.push(path.join('drafts/press', f))); break; }
              if (!(p.srcs || []).length) break;
              try { execFileSync('git', ['pull', '--rebase', 'origin', 'main'], { stdio: 'ignore' }); } catch (e) {}
            }
            if (srcFiles.length) {
              try {
                const out = execFileSync('python3', ['tools/press_srcext.py', '--json', ...srcFiles], { maxBuffer: 64e6 }).toString();
                const arr = JSON.parse(out);
                srcNote = arr.filter(r => r.text).map(r => '[첨부 자료 · ' + r.name + ']\n' + r.text).join('\n\n');
                const bad = arr.filter(r => r.error).map(r => r.name + '(' + r.error + ')');
                if (bad.length) core.warning('[press] 자료 읽기 실패: ' + bad.join(', '));
              } catch (e) { core.warning('[press] 자료 추출 실패: ' + e.message); }
            }

            // ---- 공연 자료 ----
            const perfNote = perfs.map((x, i) => {
              const nm = String(x.name || ('공연' + (i + 1))).slice(0, 160);
              const u = String(x.url || '').slice(0, 300);
              const dt = String(x.detail || '').slice(0, 24000);
              return '[공연 ' + (i + 1) + ' · ' + nm + ']' + (u ? '\n상세 링크: ' + u : '') + (dt ? '\n' + dt : '\n(상세 미수집)');
            }).join('\n\n');

            if (!perfNote.trim() && !srcNote.trim() && !prevDraft) { fail('공연을 고르거나 자료를 올려 주세요'); }
            else {
              // ================= 프롬프트 =================
              const TONE = tone === 'blog' ? {
                name: '블로그 어투(존댓말)',
                rule: [
                  '- 어투 = **존댓말 블로그체**. `~입니다 / ~하실 수 있습니다 / ~해 보시기 바랍니다`. 독자를 「여러분」으로 부르지 말고 담백하게 높인다.',
                  '- 각 꼭지 머리 = `## n. 제목 : 부제` (부제는 그 공연을 한 줄로 요약).',
                  '- 문단은 짧게 끊는다(2~4문장). 권유로 닫는 문단을 군데군데 둔다.',
                  '- 맺음은 「문화가 있는 일상은 …」류의 마무리 인사 + `※` 안내 두 줄(일정 변경 가능 안내 / 예매·문의).'
                ].join('\n')
              } : {
                name: '보도자료(관찰형 평서체)',
                rule: [
                  '- 어투 = **관찰형 평서체(`~다`)**. 기자가 쓴 것처럼 담백하게. 감탄사·이모지·과장 형용사 금지.',
                  '- 각 꼭지 머리 = `## n. 제목 · 날짜` 또는 `## n. 제목 : 부제`.',
                  '- 사실 하나에 맥락 하나를 붙이는 리듬. 홍보 문구가 아니라 **관찰**로 쓴다.',
                  '- 맺음은 전체를 한 문단으로 갈무리 + `※` 안내 두 줄(일정 변경 가능 안내 / 예매·문의).'
                ].join('\n')
              };

              let prompt = '';
              prompt += '너는 GS칼텍스 예울마루의 홍보 담당이다. 아래 자료로 **보도자료 초안**을 쓴다.\n';
              prompt += '이 글은 워드 문서로 조립돼 언론·블로그에 배포된다.\n\n';

              prompt += '# 어투 — ' + TONE.name + '\n' + TONE.rule + '\n\n';

              prompt += '# 출력 형식 (반드시 이 골격 그대로)\n';
              prompt += '===TITLE===\n제목 한 줄\n';
              prompt += '===LEDE===\n리드 한두 문장(전체를 요약)\n';
              prompt += '===BODY===\n';
              prompt += '도입 문단 2~4개\n';
              prompt += '## 1. 꼭지 제목 : 부제\n';
              prompt += '- 티켓 오픈 : …\n- 공연 일시 : …\n- 공연 장소 : …\n- 티켓 가격 : …\n- 관람 시간 : …\n- 관람 연령 : …\n';
              prompt += '본문 문단들\n';
              prompt += '[사진: 무엇을 찍은 사진인지 — 캡션: 문서에 들어갈 캡션문]\n';
              prompt += '## 2. …\n';
              prompt += '===NOTES===\n확정이 필요한 항목들(`- 항목 : 설명` 불릿)\n\n';
              prompt += '문법 규칙:\n';
              prompt += '- `## `로 시작하는 줄 = 꼭지 머리. `- 키 : 값` = 정보 불릿(꼭지 머리 바로 아래에 놓는다).\n';
              prompt += '- `[사진: … — 캡션: …]` = **단독 줄**로만 쓴다. 워드에서 빈 액자로 조립돼 사람이 사진을 끼운다. 꼭지마다 1개, 도입·맺음에 각 1개.\n';
              prompt += '- `| 왼쪽 | 오른쪽 |` 줄이 연속되면 2열 표가 된다(할인 비교처럼 진짜 표가 필요할 때만).\n';
              prompt += '- 강조는 `**굵게**`만 쓴다. 그 밖의 마크다운(제목 #, 링크, 코드)은 쓰지 마라 — 문서에 기호가 그대로 박힌다.\n\n';

              prompt += '# 절대 규칙 — 지어내기 금지\n';
              prompt += '- 날짜·시간·가격·할인율·좌석·출연자·곡목은 **아래 자료에 있는 값만** 쓴다. 없으면 비운다.\n';
              prompt += '- 자료에 없는데 필요한 값은 본문에 `〔확정 필요〕`로 남기고, ===NOTES=== 에 같은 항목을 모아 적는다.\n';
              prompt += '- **할인율을 임의로 만들지 마라.** 자료에 있는 기존 할인만 그대로 옮기고, 새로 제안하는 할인은 「제안이며 확정값이 아니다」라고 명시한다.\n';
              prompt += '- 웹으로 찾은 사실은 출처가 확실할 때만 쓰고, 공연장 공식 정보와 어긋나면 공식 정보를 따른다.\n';
              prompt += '- 무료 공연과 유료 공연을 섞어 쓰지 마라. 무료가 일부뿐이면 **어느 것이 무료인지 도입에서 못 박고**, 유료 공연은 정보 불릿에 「티켓 가격」을 반드시 노출한다.\n\n';

              if (mainName) {
                prompt += '# 메인 강조\n';
                prompt += '- 「' + mainName + '」를 **본문 분량의 40% 안팎**으로 가장 크게 다룬다. 첫 꼭지에 놓는다.\n';
                prompt += '- 나머지 꼭지는 그보다 짧게. 도입도 이 공연을 축으로 연다.\n';
                prompt += '- ⚠ 정보 불릿이 꼭지마다 고정 분량을 더해 메인 비중을 희석한다 — 메인 꼭지는 **서술 문단을 넉넉히**(다른 꼭지의 3~4배) 써야 40%에 닿는다.\n\n';
              }
              if (hooks.length) prompt += '# 강조할 점(운영자 지정)\n' + hooks.map(h => '- ' + h).join('\n') + '\n\n';
              if (perfNote) prompt += '# 공연 자료(공식 상세 페이지에서 읽은 원문)\n' + perfNote + '\n\n';
              if (srcNote) prompt += '# 첨부 자료(운영자가 올린 프로필·기획안 등)\n' + srcNote + '\n\n';

              if (revise && prevDraft) {
                prompt += '# 지금 할 일 — 아래 초안을 운영자 의견대로 고친다\n';
                prompt += '- 의견과 관계없는 부분은 **그대로 둔다**(문장을 통째로 다시 쓰지 마라).\n';
                prompt += '- 출력은 위 골격(===TITLE=== …) 전문을 다시 낸다.\n\n';
                prompt += '## 운영자 의견\n' + revise + '\n\n';
                prompt += '## 현재 초안\n' + prevDraft + '\n';
              } else {
                prompt += '# 지금 할 일\n';
                prompt += '- 먼저 자료를 다 읽고, 모르는 출연자·작품은 WebSearch·WebFetch로 확인한다(공식 정보 우선).\n';
                prompt += '- 그 다음 위 골격대로 초안을 쓴다. 분량은 공백 제외 5,000~8,000자.\n';
              }

              // ================= 실행 =================
              const args = ['-p', '--model', 'claude-opus-5', '--effort', 'max'];
              if (revise && prevDraft) args.push('--max-turns', '3');
              else args.push('--max-turns', '24', '--allowedTools', 'WebSearch,WebFetch');
              const { runClaudeWithFailover } = require(path.join(process.env.GITHUB_WORKSPACE, 'shared/claude_failover.js'));
              const _r = runClaudeWithFailover({ args, input: prompt, cwd: work });
              let text = _r.ok ? String(_r.raw || '').trim() : '';
              // 앞뒤 잡담 제거 — ===TITLE=== 부터가 본문이다.
              const ti = text.indexOf('===TITLE===');
              if (ti > 0) text = text.slice(ti);

              if (!text || text.length < 400) {
                fail(_r.ok ? '초안이 너무 짧게 나왔어요 — 다시 시도해 주세요' : (_r.error || '실행 실패'));
              } else {
                // ---- 워드 조립 ----
                const label = 'GS칼텍스 예울마루 보도자료 · ' + new Date().toISOString().slice(0, 10) +
                              (tone === 'blog' ? ' — 블로그 어투' : '') + ' (초안)';
                const specPath = path.join(work, 'press_spec.json');
                const outPath = path.join(work, 'press_out.docx');
                fs.writeFileSync(specPath, JSON.stringify({ text, label }));
                let docErr = '';
                try {
                  execFileSync('python3', ['tools/press_docx.py', '--in', specPath, '--out', outPath], { stdio: 'inherit' });
                } catch (e) { docErr = String(e.message || e).slice(0, 300); }

                const out = { id, mode: 'press', ok: true, tone, text, ts: new Date().toISOString() };
                if (!docErr && fs.existsSync(outPath) && fs.statSync(outPath).size > 512) {
                  const outRepo = 'drafts/press/' + id + '.out.docx';
                  fs.copyFileSync(outPath, outRepo);
                  out.path = outRepo;
                  out.bytes = fs.statSync(outRepo).size;
                  out.name = (tone === 'blog' ? '예울마루_보도자료_블로그어투' : '예울마루_보도자료') + '_초안.docx';
                } else {
                  // 본문은 살아 있으니 실패로 죽이지 않는다 — 워드만 빠진 채로 넘긴다(앱이 안내).
                  out.docxError = docErr || '워드 조립본이 만들어지지 않았어요';
                  core.warning('[press] 워드 조립 실패: ' + out.docxError);
                }
                fs.writeFileSync('drafts/' + id + '.json', JSON.stringify(out));
              }
            }

            // ---- 자료 원본 회수(공개 레포에 남기지 않는다) ----
            try { srcFiles.forEach(f => { if (fs.existsSync(f)) fs.unlinkSync(f); }); } catch (e) {}
            // ---- 산출물 회수 — 기능별 최근 3개만(공용 회수기) ----
            try {
              const { retainDrafts } = await import('file://' + path.join(process.env.GITHUB_WORKSPACE, 'shared/drafts_retain.mjs'));
              const rr = retainDrafts({ root: process.env.GITHUB_WORKSPACE, keep: 3, protect: id });
              core.info('[drafts] 회수 ' + rr.removed.length + '건 · 기능별 최근 ' + rr.keep + '건 유지');
            } catch (e) { core.warning('[drafts] 회수 건너뜀: ' + e.message); }

            execFileSync('git', ['config', 'user.name', 'github-actions[bot]']);
            execFileSync('git', ['config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com']);
            execFileSync('git', ['add', '-A', 'drafts']);
            execFileSync('git', ['commit', '-m', 'chore(press): ' + id + ' [skip ci]']);
            let pushed = false;
            for (let i = 0; i < 6; i++) {
              try { execFileSync('git', ['push', 'origin', 'HEAD:main']); pushed = true; break; }
              catch (e) { try { execFileSync('git', ['pull', '--rebase', 'origin', 'main']); } catch (e2) {} }
            }
            if (!pushed) core.setFailed('push 실패');

      # 활성 계정이 이번 런에 쿼터로 폴오버됐으면 누적 → 다음 계정으로 자동 전진(다른 워크플로와 같은 축).
      - name: 활성 계정 자동 승격(쿼터 누적 시)
        if: always()
        env:
          GH_VARS_TOKEN: ${{ secrets.GH_VARS_TOKEN }}
          ACTIVE_ACCOUNT: ${{ vars.ACTIVE_ACCOUNT || 'EMS1130G' }}
        run: python3 shared/account_failover.py
