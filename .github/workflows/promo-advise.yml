name: AI 홍보 전략 추론 (claude -p · repository_dispatch)

# [260806 운영자 확정] AI 홍보 자동 브리핑 — Worker 크론(매일 KST 08:30 · paAutoBrief)이 포트폴리오 팩
# (drafts/promo/<id>.in.json)을 서버에서 조립·커밋하고 repository_dispatch[promo-advise]를 던지면,
# claude -p(구독 OAuth 5계정 폴오버 · opus 5 · effort = payload 지정, 자동 = high)가 **총론 + 7/30/90일 시계**
# 조언 JSON을 drafts/<id>.json 으로 커밋한다. 앱 「AI 홍보 ▸ 전략 추론」 탭이 KV 포인터로 최신분을 자동 표시.
# 폐루프 = 조언 회차 원장(data/promo_ai/advice_runs/YYYY-MM.jsonl · 기록자 = 이 워크플로 단독)을 다음 회차가
# 입력으로 받아 「지난 제안이 실행됐나(홍보 이력 대조)·판매가 반응했나」까지 본다. Δ·트렌드는 원장에 안 굽는다(절대값만).
# 팩 = 집계 수치만(개인정보 행 0). 입력 팩은 이 런 끝에 즉시 삭제(hwp-edit 원본 삭제 관례 —
# 공개 레포라 남은 파일이 곧 노출 면적). 결과는 공용 회수기(shared/drafts_retain.mjs)가 접두별 최근 3개만 유지.

on:
  repository_dispatch:
    types: [promo-advise]

permissions:
  contents: write

concurrency:
  group: promo-advise
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # 1턴 추론이라 리서치 멀티턴(nb-blog 12분)보다 짧게 — 프론트 폴 한도(8분)와 정렬
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Advise via claude -p
        uses: actions/github-script@v7
        env:
          # 계정 선택은 여기서만 — ACTIVE_ACCOUNT 부터 체인 순환(shared/claude_failover.js). 각 계정 토큰을 ACC_<계정명> 으로.
          ACTIVE_ACCOUNT: ${{ vars.ACTIVE_ACCOUNT || 'EMS1130G' }}
          ACC_EMS1130G: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_EMS1130G }}
          ACC_EMS1130N: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_EMS1130N }}
          ACC_MUTENO: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_MUTENO }}
          ACC_MUTENONA: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_MUTENONA }}
          ACC_NOMUTEFB: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_NOMUTEFB }}
        with:
          retries: 3
          script: |
            const { execFileSync } = require('child_process');
            const fs = require('fs');
            const path = require('path');
            const _cp = context.payload.client_payload || {};
            const p = (_cp && typeof _cp.d === 'object' && _cp.d) ? _cp.d : _cp;
            const id = String(p.id || '').replace(/[^a-zA-Z0-9_-]/g, '').slice(0, 64);
            if (!id) { core.setFailed('id 없음'); return; }
            const inPath = 'drafts/promo/' + id + '.in.json';
            // 자동 브리핑(크론·auto-run) = opus 5 · effort high(운영자 260806 「opus 5.0 high」) — payload로 지정돼 온다.
            const effort = (p.effort === 'high' || p.effort === 'max') ? p.effort : 'max';
            const isAuto = !!p.auto;

            // ---- 커밋/푸시 공용 (결과 없이도 앱이 폴링 타임아웃 대신 에러를 받게, 실패도 항상 파일로 남긴다) ----
            const landOut = (out) => {
              fs.mkdirSync('drafts', { recursive: true });
              fs.writeFileSync('drafts/' + id + '.json', JSON.stringify(out));
              try { if (fs.existsSync(inPath)) fs.rmSync(inPath); } catch (e) {}   // 입력 팩 즉시 삭제(공개 레포 노출 면적 최소화)
              return (async () => {
                try {
                  const { retainDrafts } = await import('file://' + path.join(process.env.GITHUB_WORKSPACE, 'shared/drafts_retain.mjs'));
                  const rr = retainDrafts({ root: process.env.GITHUB_WORKSPACE, keep: 3, protect: id });
                  core.info('[drafts] 회수 ' + rr.removed.length + '건 · 기능별 최근 ' + rr.keep + '건 유지');
                } catch (e) { core.warning('[drafts] 회수 건너뜀: ' + e.message); }
                execFileSync('git', ['config', 'user.name', 'github-actions[bot]']);
                execFileSync('git', ['config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com']);
                execFileSync('git', ['add', '-A', 'drafts']);
                try { if (fs.existsSync('data/promo_ai')) execFileSync('git', ['add', '-A', 'data/promo_ai']); } catch (e) {}   // 조언 회차 원장 동반 커밋

                execFileSync('git', ['commit', '-m', 'chore(promo): ' + id + ' 전략 추론 [skip ci]']);
                let pushed = false;
                for (let i = 0; i < 6; i++) {
                  try { execFileSync('git', ['push', 'origin', 'HEAD:main']); pushed = true; break; }
                  catch (e) { try { execFileSync('git', ['pull', '--rebase', 'origin', 'main']); } catch (e2) {} }
                }
                if (!pushed) core.setFailed('push 실패');
              })();
            };

            // ---- 입력 팩 읽기 ----
            let pack = null;
            try { pack = JSON.parse(fs.readFileSync(inPath, 'utf8')); } catch (e) {}
            if (!pack || typeof pack !== 'object') {
              await landOut({ id, mode: 'promoAdvice', ok: false, error: '입력 팩을 찾지 못했어요(업로드 직후 다시 시도해 주세요)', ts: new Date().toISOString() });
              return;
            }

            // ---- 조언 회차 원장 읽기(폐루프 입력 · 운영자 260806 「아이디어도 배선」) — 최근 2회차 ----
            const ledgerDir = 'data/promo_ai/advice_runs';
            let prevRuns = [];
            try {
              const shards = fs.readdirSync(ledgerDir).filter((f) => /^\d{4}-\d{2}\.jsonl$/.test(f)).sort().slice(-2);
              const lines = [];
              for (const sh of shards) lines.push(...fs.readFileSync(path.join(ledgerDir, sh), 'utf8').split('\n').filter(Boolean));
              prevRuns = lines.slice(-2).map((l) => { try { return JSON.parse(l); } catch (e) { return null; } }).filter(Boolean);
            } catch (e) { /* 원장 없음 = 첫 회차 */ }

            // ---- 팩 → 프롬프트 섹션 (사람이 읽는 압축 서술 — 원시 JSON 덤프보다 모델이 정확히 읽는다) ----
            const S = (v, n) => String(v == null ? '' : v).slice(0, n || 400);
            const NUM = (v) => (v == null || v === '' || isNaN(v)) ? null : Math.round(Number(v) * 10) / 10;
            const fmtSales = (s) => {
              if (!s || s.none) return '판매 데이터 없음' + (s && s.why ? ' — ' + S(s.why, 200) : '');
              const L = [];
              if (s.status) L.push('상태 ' + S(s.status, 20));
              if (s.seats != null) L.push('누적 판매 ' + s.seats + '석' + (s.totalOpen ? ' / 총오픈 ' + s.totalOpen + '석 (점유율 ' + (NUM(s.occ) == null ? '?' : NUM(s.occ)) + '%)' : ''));
              if (s.target != null) L.push('목표 점유율 ' + s.target + '%');
              if (s.dday != null) L.push('공연 시작까지 D-' + s.dday);
              if (s.fcRate != null) L.push('최근 판매 페이스 일평균 ' + NUM(s.fcRate) + '석/일');
              if (s.groupSeats) L.push('단체 유입 ' + s.groupSeats + '석');
              let out = L.join(' · ');
              if (Array.isArray(s.last7) && s.last7.length) out += '\n  최근 실측(누적석): ' + s.last7.map((r) => S(r.d, 10) + '=' + r.seat).join(', ');
              if (Array.isArray(s.curve) && s.curve.length) out += '\n  누적 곡선(일자=누적): ' + s.curve.map((c) => S(c[0], 10) + '=' + c[1]).join(', ');
              if (s.note) out += '\n  비고: ' + S(s.note, 300);
              return out;
            };
            const fmtPromo = (pr) => {
              if (!pr) return '홍보 이력 없음';
              const L = [];
              if (Array.isArray(pr.history) && pr.history.length) L.push('지난 홍보(' + pr.history.length + '건): ' + pr.history.map((h) => S(h.d, 10) + ' ' + S(h.ch, 12) + (h.t ? '「' + S(h.t, 30) + '」' : '') + (h.st === '완료' ? '' : '(' + S(h.st, 6) + ')')).join(' / '));
              else L.push('지난 홍보 0건');
              if (Array.isArray(pr.planned) && pr.planned.length) L.push('예정된 홍보: ' + pr.planned.map((h) => S(h.d, 10) + ' ' + S(h.ch, 12) + (h.t ? '「' + S(h.t, 30) + '」' : '')).join(' / '));
              if (pr.lastDate) L.push('마지막 홍보일 ' + S(pr.lastDate, 10));
              return L.join('\n');
            };
            const fmtCal = (cal) => {
              if (!cal || !Array.isArray(cal.busy) || !cal.busy.length) return '앞으로 3주 카카오톡·문자 슬롯: 전부 비어 있음';
              return '앞으로 3주 이미 점유된 슬롯(카카오톡·문자는 하루 1건 전 프로그램 공용):\n' + cal.busy.map((d) => '  ' + S(d.d, 10) + ' — ' + S(d.what, 120)).join('\n');
            };
            const fmtAud = (a) => {
              if (!a) return '고객 데이터 미포함(관리자 로그인에서만 동봉됨)';
              const L = [];
              if (a.sampleNote) L.push('⚠ 표본 설명(그대로 존중): ' + S(a.sampleNote, 300));
              if (a.genre) L.push('이 프로그램 장르(' + S(a.genre, 12) + ') 재관람(2회+) 회원: ' + a.gRepeat + '명 · 그 장르 누적 ' + a.gTix + '매');
              if (a.allRepeat != null) L.push('전 장르 재관람(2회+) 회원: ' + a.allRepeat + '명');
              if (Array.isArray(a.age) && a.age.length) L.push('회원 연령대 TOP: ' + a.age.map((x) => S(x[0], 8) + ' ' + x[1] + '명').join(', '));
              if (Array.isArray(a.city) && a.city.length) L.push('회원 거주지 TOP: ' + a.city.map((x) => S(x[0], 10) + ' ' + x[1] + '명').join(', '));
              if (a.memberN) L.push('회원 전체 ' + a.memberN + '명');
              return L.length ? L.join('\n') : '고객 데이터 없음';
            };
            const fmtProg = (g, withDetail) => {
              const L = [];
              L.push('이름: ' + S(g.name, 120) + (g.short ? ' (줄임말 ' + S(g.short, 40) + ')' : ''));
              L.push('구분: ' + S(g.type, 10) + (g.genre ? ' · 장르 ' + S(g.genre, 30) : '') + (g.place ? ' · 장소 ' + S(g.place, 40) : ''));
              if (g.period) {
                if (g.period.show) L.push('공연·행사 기간: ' + S(g.period.show[0], 10) + ' ~ ' + S(g.period.show[1], 10));
                if (g.period.sale) L.push('판매 기간: ' + S(g.period.sale[0], 10) + ' ~ ' + S(g.period.sale[1], 10) + ' ← 홍보는 이 안에서만 의미가 있다');
                if (g.period.promoStart) L.push('홍보 시작일: ' + S(g.period.promoStart, 10));
              }
              if (g.promoOpen === false) L.push('⚠ 홍보 게이트 닫힘 — 프로그램 시트에 홍보노출·홍보시작일이 안 채워져 있어 앱에서 홍보 신청 자체가 막혀 있다(구 점검 A0 신호)');
              L.push('판매: ' + fmtSales(g.sales));
              L.push('홍보: ' + fmtPromo(g.promo));
              if (g.detail) {
                L.push('상세페이지 재료(있는 사실만 인용 — 할인율·조기예매 마감·가격·특전을 액션 시점 계산에 활용):\n' + S(g.detail.text, withDetail ? 2600 : 900));
                if (g.detail.ocr) L.push('포스터·상세이미지 OCR:\n' + S(g.detail.ocr, withDetail ? 2600 : 900));
              } else if (withDetail) {
                L.push('상세페이지: 없음(URL 미등록 — 메시지 각도 재료 부족)');
              }
              return L.join('\n');
            };

            const scope = pack.scope === 'portfolio' ? 'portfolio' : 'program';
            let dataSec = '';
            if (scope === 'program' && pack.program) {
              dataSec += '# 대상 프로그램\n' + fmtProg(pack.program, true) + '\n\n';
            } else {
              const list = Array.isArray(pack.programs) ? pack.programs.slice(0, 20) : [];
              dataSec += '# 판매 중·예정 기획 프로그램 전체 (' + list.length + '개)\n\n';
              list.forEach((g, i) => { dataSec += '## ' + (i + 1) + '. ' + S(g.name, 120) + '\n' + fmtProg(g, false) + '\n\n'; });
            }
            dataSec += '# 홍보 캘린더 점유 현황\n' + fmtCal(pack.calendar) + '\n\n';
            dataSec += '# 고객 데이터(집계 — 개인정보 없음)\n' + fmtAud(pack.audience) + '\n\n';
            if (pack.context && Array.isArray(pack.context.competing) && pack.context.competing.length) {
              dataSec += '# 같은 기간 자체 기획 프로그램(홍보 슬롯·관객을 나눠 쓰는 상대)\n' + pack.context.competing.map((c) => '- ' + S(c.name, 80) + ' (' + S(c.type, 8) + (c.period ? ' · ' + S(c.period, 30) : '') + ')').join('\n') + '\n\n';
            }
            if (pack.ask) dataSec += '# 담당자 요청(우선 반영)\n' + S(pack.ask, 800) + '\n\n';
            if (prevRuns.length) {
              dataSec += '# 지난 조언 회차 (원장 — 이번 브리핑은 여기서 이어진다)\n';
              prevRuns.forEach((rn) => {
                dataSec += '## ' + S(rn.ts, 10) + (rn.auto ? ' 자동' : ' 수동') + ' 회차\n';
                ((rn.key) || []).slice(0, 12).forEach((k) => { dataSec += '- 그때 ' + S(k.name, 60) + ': 누적 ' + (k.seats != null ? k.seats + '석' : '?') + (k.occ != null ? ' (' + k.occ + '%)' : '') + (k.fcRate != null ? ' · 페이스 ' + k.fcRate + '석/일' : '') + '\n'; });
                if (rn.advice && rn.advice.headline) dataSec += '- 그때 핵심: ' + S(rn.advice.headline, 100) + '\n';
                if (rn.advice && rn.advice.verdict) dataSec += '- 그때 총론: ' + S(rn.advice.verdict, 500) + '\n';
                ((rn.advice && rn.advice.actions) || []).forEach((a, i) => { dataSec += '- 그때 제안' + (i + 1) + (a.h ? '(' + a.h + ')' : '') + ': ' + [a.program, a.when, a.channel, a.message].filter(Boolean).map((x) => S(x, 60)).join(' · ') + '\n'; });
                dataSec += '\n';
              });
            }

            // ---- 전략가 프롬프트 (이 파일이 프롬프트 SSOT — 산출이 이상하면 여기를 고친다) ----
            let prompt = '';
            prompt += '당신은 GS칼텍스 예울마루(전남 여수의 복합문화예술공간)의 홍보·판매 전략 분석가입니다.\n';
            prompt += '아래는 이 공연장의 실제 운영 데이터입니다(집계 수치만 — 개인정보 없음). 이 데이터만 근거로, ';
            prompt += '판매율을 효과적으로 높이기 위해 「앞으로 어떤 홍보를 언제 어디서 어떻게 할지」를 조언하세요.\n';
            prompt += '오늘 날짜: ' + S(pack.today, 10) + '\n\n';
            prompt += '# 원칙 (어기면 실패작)\n';
            prompt += '1. 사실만 — 데이터에 없는 수치·사실·고객 반응을 지어내지 않는다. 근거가 없으면 그 조언은 빼고, 부족한 데이터는 gaps에 적는다.\n';
            prompt += '2. 조언은 「달력에 옮길 수 있는」 수준으로 구체적으로 — 시기(가능하면 날짜, 아니면 주 단위), 채널, 타겟, 메시지 각도까지 채운다.\n';
            prompt += '3. 채널 규칙: 카카오톡·문자는 하루 1건(전 프로그램 공용 슬롯) — 캘린더 점유 현황과 겹치지 않는 비어 있는 날을 고른다. 그 외 채널(인스타그램·블로그·홈페이지·B2B·현수막 등)은 지난 홍보 이력에 실제로 등장한 채널 안에서 고른다.\n';
            prompt += '4. 홍보는 판매 촉진 수단 — 판매종료일 이후는 계획하지 않는다(이 조직의 확정 규칙: 판매 종료 = 홍보 목적 소멸).\n';
            prompt += '5. 고객 수치는 「확정 연결된 표본의 하한」이다 — 동봉된 표본 설명을 그대로 존중하고 임의로 환산·과장하지 않는다.\n';
            prompt += '6. 메시지 각도는 상세페이지 재료(본문·OCR)에 실제로 있는 표현·사실에서만 뽑는다. 재료가 없으면 「재료 부족」이라고 쓰고 만들어내지 않는다.\n';
            prompt += '7. 과장 수식(「최고의」 「완벽한」)과 근거 없는 확신 금지. 판매 페이스 해석은 남은 기간·총오픈석 대비로 정량적으로.\n';
            prompt += '8. 이미 예정된 홍보와 중복인 제안은 하지 않는다 — 예정분을 보완·조정하는 제안은 가능(그렇다고 명시).\n';
            prompt += '9. 지난 조언 회차가 있으면: ⓐ 그 제안이 실행됐는지 「예정된 홍보·지난 홍보」에서 확인하고(제안한 날짜·채널이 이력에 있으면 실행된 것) ⓑ 실행분은 그때→지금 수치 변화로 효과를 총론에 한 줄 평가 ⓒ 미실행 제안을 그대로 반복하지 말 것 — 아직 유효하면 시기를 조정해 다시, 아니면 접은 이유를 말한다.\n';
            prompt += '10. 다음 세 신호는 발견되면 반드시 다룬다(구 「점검」 기능의 이관 — 운영자 260807): ⓐ 티켓오픈(판매시작) D-3 이내인데 그날 카카오 슬롯이 비어 있다 → d7 최우선 후보 ⓑ 판매종료 D-14 이내인데 예정된 홍보가 0건이다 → d7에 회수 계획 ⓒ 「⚠ 홍보 게이트 닫힘」인데 판매가 임박했다 → 홍보 제안보다 먼저 「프로그램 시트에서 홍보노출부터 열어야 한다」를 avoid나 첫 액션에 명시한다(지금은 앱에서 신청 자체가 안 된다).\n';
            prompt += '11. 상세페이지 재료에 할인율·조기예매 마감·가격·특전이 보이면 그 시한을 액션 날짜 계산에 쓴다(예: 조기예매 25%가 08-08 마감이면 그 전날·당일이 발송 최적일). 단 판매기간·공연일은 시트가 정본 — 재료와 어긋나면 시트를 따른다.\n\n';
            if (scope === 'portfolio') {
              prompt += '# 이번 요청 = 전체 총론 (운영자: 「공연을 나눠서가 아니라 총론」)\n';
              prompt += '프로그램별 소제목으로 나눠 쓰지 말고, 포트폴리오 전체를 한 번에 보고 「지금 홍보 운영이 어디에 서 있고, 무엇부터 움직여야 하는가」를 한 편의 브리핑으로 말하세요. ';
              prompt += '다만 개별 액션이 특정 프로그램을 가리키면 program 필드에 이름을 명시하세요.\n';
              prompt += '시계 3단(운영자: 「7일 30일 90일」) = d7 앞으로 7일(당장 실행 — 비어 있는 카카오·문자 슬롯을 날짜로 지정할 수준) · d30 앞으로 30일(한 달 캠페인 축 — 임박 오픈·마감·타겟 활용) · d90 앞으로 90일(분기 축 — 시즌 흐름·판매 시작 전 빌드업·재관람층 관계). 슬롯 상세 데이터는 3주 창까지만 제공되므로 그 밖은 주 단위로 제안하세요.\n\n';
            }
            prompt += dataSec;
            prompt += '# 글쓰기 형식 — 살아있는 소식통 톤 (운영자 260806 「노뮤트가 잘 전달하는 그 느낌으로」 · 원본 = nomute chan_brief v9.4 말투 계약 이식)\n';
            prompt += '- 친근한 소식통 톤. 단문으로 툭툭 끊되 길이를 섞고, 종결을 「~다」에 가두지 말고 「~더라(현장)·~네(발견)·~거든(배경)」을 verdict 전체에서 1~2번. 어려운 말은 중학생도 한 번에 읽게 풀어 쓴다.\n';
            prompt += '- 수치는 끊어 던지고 자기정정으로 강조한다 — 「99석이었다. 발송 다음날 **112석**. 평소의 다섯 배.」 · 「무려·심지어·하필·그것도」 훅 · 대시(—)·쉼표로 뜸을 준다.\n';
            prompt += '- 금지: 느낌표 떡칠 · 하트 · 2인칭 호칭(여러분/너) · 신파·오글 · 말줄임(...) 남발 · 「확인했어요/살펴보니」 류 서두 사족.\n';
            prompt += '- verdict = 문단 2~4개(빈 줄 \\n\\n 구분 · 한 문단 1~3문장). 마지막 문단은 「→ 그래서 지금 할 일은 …」 꼴의 결론 한 줄로 닫는다.\n';
            prompt += '- 강조 2층: 판을 규정하는 핵심어·제일 크게 튄 수치·전환점 = *별표 하나*(1층 = 강조색 · 진짜 특별한 것만 · verdict 전체 1~2개) / 그다음 눈이 먼저 가야 할 명사구·수치 = **별표 둘**(2층 = 볼드 · 문단당 1~3개 넉넉히 — 밋밋하면 실패다). 별표 사이 줄바꿈 금지 · 짝 반드시 닫기 · 다른 마크다운 금지.\n';
            prompt += '- 변화 표기: 「이전→**이후**」 — 화살표 뒤(지금 값)를 굵게. 정말 튄 변화 하나는 *1층*으로 올려도 된다.\n';
            prompt += '- 프로그램·항목을 3개 이상 나열할 땐 문장에 욱여넣지 말고 목록 줄로 가른다(운영자 260807) — 같은 문단 안에서 줄바꿈(\\n) 뒤 「- 라벨: 항목 · 항목」 꼴. 형식 예(수치는 예시):\n';
            prompt += '  전체 그림은 둘로 갈려 있습니다.\n  - 이미 다 팔린 쪽: 그날들 1147석(**123.9%**) · 달 샤베트 958석\n  - 바닥인 쪽: 피아노×2 **2.6%** · 트리플 빌 6.7% · 조재혁 12%\n  그리고 가장 급한 건 브런치 Ⅲ입니다 — 처럼 목록 뒤에 문장으로 잇는다.\n';
            prompt += '- 「그냥 홍보를 늘리자」 류 일반 훈수 금지 — 모든 제안엔 수치·이력 근거가 붙는다. 애매하면 「이건 데이터로 아직 모른다」고 말한다 — 확실 7할을 또렷하게 > 불확실 10할을 그럴듯하게.\n';
            prompt += '- 이 계약은 headline·actions의 message·why, avoid, gaps에도 적용된다(짧은 자리는 2층 볼드 위주).\n\n';
            prompt += '# 출력 형식 (JSON 객체만 — 설명·머리말·코드블록 없이)\n';
            if (scope === 'portfolio') {
              prompt += '{ "headline": "오늘의 핵심 한 줄(60자 이내 · 쉬운 말 · 굵게 표시 가능)",\n';
              prompt += '  "verdict": "총론 — 문단 2~4개(빈 줄 구분) · 전체 판매·홍보가 어디에 서 있고 무엇부터 움직일지(지난 회차가 있으면 그 평가 한 문단)",\n';
              prompt += '  "horizons": {\n';
              prompt += '    "d7":  [ { "when": "구체 날짜", "channel": "채널", "target": "타겟", "message": "메시지 각도 한 줄", "why": "근거 데이터", "program": "해당 프로그램명(있을 때만)" } ],\n';
              prompt += '    "d30": [ { "when": "주 단위 시기", "channel": "채널", "target": "타겟", "message": "메시지 각도", "why": "근거", "program": "해당 시" } ],\n';
              prompt += '    "d90": [ { "when": "달·분기 시기", "channel": "채널", "target": "타겟", "message": "메시지 각도", "why": "근거", "program": "해당 시" } ] },\n';
              prompt += '  "avoid": [ "지금 하지 말아야 할 것" ], "gaps": [ "부족했던 데이터" ] }\n';
              prompt += 'd7 = 2~4개 · d30 = 2~4개 · d90 = 1~3개, 각 시계 안에서 우선순위순.\n';
            } else {
              prompt += '{ "headline": "핵심 한 줄(60자 이내)",\n';
              prompt += '  "verdict": "현황 진단 — 문단 1~3개(빈 줄 구분) · 판매 페이스 vs 남은 기간, 핵심 문제/기회",\n';
              prompt += '  "actions": [ { "when": "실행 시기", "channel": "채널", "target": "타겟(근거 데이터 기반)", "message": "메시지 각도 한 줄", "why": "근거가 된 데이터 수치·사실" } ],\n';
              prompt += '  "avoid": [ "지금 하지 말아야 할 것·주의점" ], "gaps": [ "이번 판단에서 부족했던 데이터" ] }\n';
              prompt += 'actions는 우선순위순 3~5개.\n';
            }

            // ---- claude -p 실행 (활성 계정부터 체인 순환 폴오버 — nb-blog와 같은 엔진) ----
            // 1턴 순수 추론 — 데이터는 팩에 전부 있으므로 웹 도구 불필요(환각 표면 최소화).
            // cwd = 러너 임시폴더 — 레포 CLAUDE.md(앱 개발 지침)가 전략 컨텍스트에 섞이지 않게 격리(nb-blog 관례).
            const { runClaudeWithFailover } = require(path.join(process.env.GITHUB_WORKSPACE, 'shared/claude_failover.js'));
            const _r = runClaudeWithFailover({ args: ['-p', '--model', 'claude-opus-5', '--effort', effort, '--max-turns', '1'], input: prompt, cwd: process.env.RUNNER_TEMP || '/tmp' });
            const raw = _r.ok ? String(_r.raw || '').trim() : '';

            // ---- 결과 파싱 — JSON 이탈 시에도 원문을 버리지 않는다(형식 실패 ≠ 내용 실패) ----
            let out;
            if (!raw) {
              out = { id, mode: 'promoAdvice', ok: false, error: (_r.error || '빈 응답'), ts: new Date().toISOString() };
            } else {
              let t = raw.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/i, '').trim();
              let adv = null;
              try { adv = JSON.parse(t); } catch (e) { const m = t.match(/\{[\s\S]*\}/); if (m) { try { adv = JSON.parse(m[0]); } catch (e2) {} } }
              // 근거 요약(basis) — 앱 [근거 데이터 보기]가 그대로 보여준다(AI가 무엇을 보고 판단했는지 투명성 축)
              const keyOf = (g) => { const s = (g && g.sales) || {}; return { name: g && g.name, seats: s.seats != null ? s.seats : null, totalOpen: s.totalOpen != null ? s.totalOpen : null, occ: s.occ != null ? s.occ : null, dday: s.dday != null ? s.dday : null, fcRate: s.fcRate != null ? s.fcRate : null }; };
              const keys = scope === 'program' ? (pack.program ? [keyOf(pack.program)] : []) : (pack.programs || []).map(keyOf);
              const basisL = ['오늘 ' + S(pack.today, 10) + ' · ' + (scope === 'portfolio' ? '포트폴리오 ' + keys.length + '개(총론 · 7/30/90일)' : '프로그램 1개') + (isAuto ? ' · 자동(서버 조립 · 축약 집계)' : '') + ' · opus5/' + effort];
              keys.slice(0, 12).forEach((k) => basisL.push('· ' + S(k.name, 60) + ' — 누적 ' + (k.seats != null ? (k.seats + (k.totalOpen ? '석/' + k.totalOpen + '석' : '석')) : '?') + (k.occ != null ? ' (' + k.occ + '%)' : '') + (k.dday != null ? ' · D-' + k.dday : '') + (k.fcRate != null ? ' · ' + k.fcRate + '석/일' : '')));
              basisL.push('· 3주 내 카카오·문자 점유일 ' + (((pack.calendar || {}).busy) || []).length + '일' + (pack.audience ? ' · 고객 집계 동봉' : ' · 고객 집계 미포함'));
              if (prevRuns.length) basisL.push('· 지난 조언 ' + prevRuns.length + '회차 반영(폐루프)');
              const basis = basisL.join('\n');
              if (adv && typeof adv === 'object' && (adv.verdict || adv.horizons || Array.isArray(adv.actions))) {
                out = { id, mode: 'promoAdvice', ok: true, scope, auto: isAuto ? 1 : 0, advice: adv, basis, ts: new Date().toISOString() };
                // ---- 조언 회차 원장 적재(기계산출물 · 기록자 = 이 워크플로 단독 · 월 샤딩 · Δ·트렌드는 안 굽는다 = nomute algo_runs 문법) ----
                try {
                  fs.mkdirSync(ledgerDir, { recursive: true });
                  const flat = [];
                  if (adv.horizons) ['d7', 'd30', 'd90'].forEach((hk) => ((adv.horizons[hk] || []).forEach((a) => flat.push({ h: hk, program: a.program, when: a.when, channel: a.channel, message: a.message }))));
                  else (adv.actions || []).forEach((a) => flat.push({ program: a.program, when: a.when, channel: a.channel, message: a.message }));
                  const shard = path.join(ledgerDir, new Date().toISOString().slice(0, 7) + '.jsonl');
                  fs.appendFileSync(shard, JSON.stringify({ ts: new Date().toISOString(), id, scope, auto: isAuto ? 1 : 0, model: 'claude-opus-5', effort, key: keys, calBusy: (((pack.calendar || {}).busy) || []).length, advice: { headline: adv.headline, verdict: adv.verdict, actions: flat.slice(0, 10), avoid: adv.avoid } }) + '\n');
                } catch (e) { core.warning('[ledger] 적재 건너뜀: ' + e.message); }
              } else {
                // 형식 이탈 — 조언 원문을 텍스트로 전달(프론트가 본문 그대로 렌더). 「완료」로 부르되 형식 실패를 명시. 원장엔 안 굽는다(구조 없는 회차 = 다음 회차 입력으로 못 쓴다).
                out = { id, mode: 'promoAdvice', ok: true, scope, auto: isAuto ? 1 : 0, advice: null, text: raw.slice(0, 12000), formatMiss: true, basis, ts: new Date().toISOString() };
              }
            }
            await landOut(out);

      # 활성 계정이 이번 런에 쿼터로 폴오버됐으면 누적 → THRESHOLD(2)회+ 면 다음 계정으로 자동 전진.
      # GH_VARS_TOKEN 없으면 no-op = 라이브 무해. 신호(.nomute_active_quota)는 같은 job workspace 공유로 자동 일치.
      - name: 활성 계정 자동 승격(쿼터 누적 시)
        if: always()
        env:
          GH_VARS_TOKEN: ${{ secrets.GH_VARS_TOKEN }}
          ACTIVE_ACCOUNT: ${{ vars.ACTIVE_ACCOUNT || 'EMS1130G' }}
        run: python3 shared/account_failover.py
