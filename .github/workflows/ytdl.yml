name: 링크 자료수집 영상 저장 (yt-dlp · repository_dispatch)

# 앱(콘텐츠 제작 ▸ 링크 자료수집)이 repository_dispatch[ytdl]로 {d:{id,url,title,q}}를 던지면
# 러너가 yt-dlp로 영상을 받아 릴리스 ytdl-drops 자산(<id>.mp4)으로 올린다.
# 앱은 /api/linkgrab/ytstat 폴링 → /api/linkgrab/ytfile(서명 URL 발급)로 브라우저가 직접 내려받는다.
# q = 화질(max·1080·720·480 · 기본 max) — 앱 화질 선택칩이 실어보낸다(260803).
# 실패 시 <id>.err.txt 자산을 올려 앱이 **실패 사유를 그대로** 표시(260803 개정 — 구판은 원인과 무관하게
# 「초대형(6GB 초과)」이라고만 떠서 운영자가 용량 문제로 오해했다. 실제 원인은 유튜브 봇 차단이었다).
# 매 실행 끝에 7일 지난 자산은 자동 정리.

on:
  repository_dispatch:
    types: [ytdl]
  workflow_dispatch:            # 손 테스트용 — 봇 차단은 러너 IP에서만 재현돼 로컬 검증이 불가능하다(260803 실측)
    inputs:
      url: { description: '영상 주소', required: true }
      q:   { description: '화질 max|1080|720|480', required: false, default: 'max' }
      id:  { description: '자산 id(비우면 수동테스트용 고정값)', required: false, default: 'vmanualtest00000' }

permissions:
  contents: write

concurrency:
  group: ytdl-${{ github.event.client_payload.d.id || inputs.id }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VID_ID: ${{ github.event.client_payload.d.id || inputs.id }}
      VID_URL: ${{ github.event.client_payload.d.url || inputs.url }}
      VID_Q: ${{ github.event.client_payload.d.q || inputs.q || 'max' }}
      REPO: ${{ github.repository }}
      MAXSIZE: 6000m
      # 유튜브 쿠키(넷스케이프 형식 전문)를 리포 시크릿 YT_T_COOKIES에 넣어두면 봇 차단이 확실히 풀린다.
      # 없어도 동작한다(아래 클라이언트 사다리로 최선을 다한다) — 있으면 성공률이 크게 오른다.
      # ⚠ 다운로더 전용 시크릿 = YT_T_COOKIES(운영자 260804). 구 YT_COOKIES는 **손대지 않는다** —
      #   2주 전부터 있던 배선이고 값도 다르며 다운로드가 아닌 다른 용도로 쓰인다(운영자 확인).
      #   폴백(`|| secrets.YT_COOKIES`)도 일부러 안 건다 — 비었을 때 남의 용도 쿠키를 조용히 끌어쓰면
      #   그게 더 위험하다(계정이 섞인다). 없으면 없는 대로 쿠키 없이 진행한다.
      YT_COOKIES: ${{ secrets.YT_T_COOKIES }}
    steps:
      - name: yt-dlp · PO 토큰 공급자 설치
        run: python3 -m pip install --quiet --upgrade yt-dlp bgutil-ytdlp-pot-provider

      # 왜 필요한가(260803 실측): 러너 IP에서 yt-dlp가 「Sign in to confirm you're not a bot」으로 2초 만에 즉사했다.
      #  · JS 런타임 없음 = nsig 복호 불가 → "some formats may be missing" 경고 + 포맷 누락
      #  · GVS PO 토큰 없음 = 미디어 URL이 HTTP 403
      # deno 하나로 두 축(JS 챌린지 공급자 + bgutil script-deno PO 토큰 공급자)이 동시에 켜진다.
      - uses: denoland/setup-deno@v2
        continue-on-error: true
        with:
          deno-version: v2.x

      - name: PO 토큰 공급자 준비(deno 스크립트 모드)
        continue-on-error: true          # 실패해도 다운로드는 그대로 시도한다(보강 장치일 뿐 = fail-soft)
        run: |
          set -e
          git clone -q --depth 1 --branch 1.3.1 \
            https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git /tmp/bgutil
          mkdir -p ~/bgutil-ytdlp-pot-provider
          cp -r /tmp/bgutil/server ~/bgutil-ytdlp-pot-provider/
          cd ~/bgutil-ytdlp-pot-provider/server
          deno install --allow-scripts --quiet
          # 사전 1회 호출 = 의존성 캐시 워밍업. 안 하면 첫 호출이 yt-dlp의 15초 타임아웃에 걸려
          # 공급자가 통째로 '없음(unavailable)'으로 떨어진다(로컬 실측 260803).
          deno run --allow-env --allow-net --allow-ffi --allow-write --allow-read src/generate_once.ts --version

      - name: 릴리스 보관함 준비 (ytdl-drops)
        run: |
          gh release view ytdl-drops -R "$REPO" >/dev/null 2>&1 || \
            gh release create ytdl-drops -R "$REPO" --prerelease \
              --title "링크 자료수집 영상 보관함" \
              --notes "앱 '링크 자료수집'이 요청한 영상 파일 임시 보관함 — 7일 지난 파일은 자동 정리됩니다."

      - name: 영상 다운로드 → 자산 업로드 (1.9GB 초과 = 재생 가능한 편으로 자동 분할)
        run: |
          set +e
          mkdir -p out
          # 화질 → 포맷 선택자. mp4/m4a 우선, 없으면 아무 코덱이나 받아 --remux-video mp4 로 mp4 컨테이너 보장.
          # (구판은 mp4·1080 고정이라 ⓐ 최고화질 VP9·AV1 판을 통째로 못 봤고 ⓑ 병합이 mkv로 떨어지면
          #  아래 mv 가 .mp4 로 개명해 내보냈다 = 확장자가 거짓말하는 파일.)
          case "$VID_Q" in
            1080|720|480) FMT="bv*[ext=mp4][height<=${VID_Q}]+ba[ext=m4a]/bv*[height<=${VID_Q}]+ba/b[height<=${VID_Q}]/b" ;;
            *)            FMT="bv*[ext=mp4]+ba[ext=m4a]/bv*+ba/b" ;;
          esac
          echo "화질=$VID_Q · 포맷=$FMT"

          # 쿠키 정책 = nomute-editor vidl_run.py 정본 계승(운영자 Downloader.bat v6.2 실측):
          #   「YouTube에는 쿠키를 먼저 넘기지 않는다」 — --cookies 를 주면 yt-dlp가 '로그인 세션'으로 판단해
          #   유튜브 플레이어 클라이언트가 바뀌고 **최고화질 판이 안 잡힌다**(v6.1→v6.2 개정 사유).
          #   → 유튜브 = 무쿠키 사다리 선행 → 전부 실패했을 때만 쿠키로 1회 재시도(봇 차단·연령·멤버십 회수).
          #   → 비유튜브 = 처음부터 쿠키 사용(화질 저하 축이 없다).
          : > out/err.log
          COOKIE_ARGS=""
          if [ -n "$YT_COOKIES" ]; then
            printf '%s' "$YT_COOKIES" > /tmp/ck.txt
            # ⚠ 붙여넣기 사고 검문(260804 실측) — 넷스케이프 형식은 **탭 구분**이라 채팅·웹에서 복사하면
            #   탭이 공백이 되고 yt-dlp는 **에러 없이 쿠키 0개로** 로드한다(경고만 뜬다). 그러면 시크릿을
            #   넣고도 봇 차단이 그대로라 「쿠키가 안 듣는다」로 오진한다 → 여기서 세어 화면에 사유로 올린다.
            # ⚠ `|| echo 0` 금지 — grep -c 는 0건일 때 이미 "0"을 찍고 rc=1 로 끝난다.
            #   거기에 echo 0 을 더하면 "0\n0" 이 돼 [ -eq ] 이 "integer expression expected" 로 터진다(260804 실측).
            #   이 블록은 `set +e` 구간이라 rc=1 자체는 무해하다.
            CKN=$(grep -cP '^[^#[:space:]][^\t]*\t[^\t]*\t[^\t]*\t[^\t]*\t[^\t]*\t[^\t]*\t' /tmp/ck.txt 2>/dev/null)
            if [ "${CKN:-0}" -eq 0 ]; then
              echo "::warning::YT_COOKIES 형식 오류 — 탭 구분 줄 0개. 쿠키 없이 진행한다."
              echo "COOKIEFMT: YT_COOKIES 형식 오류 — 탭 구분 줄이 0개예요(채팅·웹에서 복사하면 탭이 공백이 됩니다). cookies.txt 파일을 메모장으로 열어 Ctrl+A·Ctrl+C 로 다시 넣어주세요." >> out/err.log
              rm -f /tmp/ck.txt
            else
              COOKIE_ARGS="--cookies /tmp/ck.txt"
              echo "쿠키 인식: ${CKN}줄"
            fi
          fi
          case "$VID_URL" in *youtube.com*|*youtu.be*) IS_YT=1 ;; *) IS_YT=0 ;; esac
          PASS1_CK="$COOKIE_ARGS"; [ "$IS_YT" = 1 ] && PASS1_CK=""

          # 클라이언트 사다리 — 유튜브가 클라이언트별로 다르게 막는다(260803 실측: 기본=미디어 403 ·
          # web_safari=봇 확인 · tv=DRM). 하나가 막혀도 다음이 뚫으면 되니 성공할 때까지 순서대로 시도한다.
          rc=1
          LAST="android_vr"
          for CL in "" "web_safari" "mweb" "tv_simply" "android_vr"; do
            if [ -n "$CL" ]; then EA="--extractor-args youtube:player_client=$CL"; else EA=""; fi
            # 마지막 회차만 -v — 실패 시 err.txt가 스스로 진단서가 된다(JS 런타임·PO 토큰 공급자가 실제로
            # 켜졌는지, 어느 단계에서 막혔는지). 앞 회차까지 -v를 켜면 로그가 사유를 덮어버린다.
            [ "$CL" = "$LAST" ] && VB="-v" || VB=""
            echo "--- 시도: client=${CL:-기본}" >> out/err.log
            # shellcheck disable=SC2086
            yt-dlp $VB -f "$FMT" --merge-output-format mp4 --remux-video mp4 \
              --max-filesize "$MAXSIZE" --no-playlist --retries 3 --fragment-retries 5 \
              $EA $PASS1_CK -o "out/${VID_ID}.%(ext)s" "$VID_URL" 2>> out/err.log
            rc=$?
            f=$(ls out/"${VID_ID}".* 2>/dev/null | grep -Ev "err|\.p[0-9]" | head -1)
            if [ $rc -eq 0 ] && [ -n "$f" ]; then break; fi
            rm -f out/"${VID_ID}".mp4 out/"${VID_ID}".mkv out/"${VID_ID}".webm out/"${VID_ID}".part 2>/dev/null
          done
          # 유튜브 무쿠키 전패 → 쿠키 **사다리** 재시도. 여기까지 와서야 화질보다 '받는 것'이 우선이다.
          #   ⚠ 구판은 기본 클라이언트 1회뿐이었는데 260804 실측에서 그게 부족한 게 드러났다:
          #     쿠키로 봇 벽은 넘었지만 그 계정이 **SABR 스트리밍 실험**(yt-dlp #12482)에 편입돼
          #     기본 클라이언트에선 "Only images are available" → "Requested format is not available".
          #   SABR은 **계정 단위**라 클라이언트를 바꾸면 회피되는 경우가 있다 → 쿠키에도 사다리를 태운다.
          #   tv·ios를 앞에 두는 이유 = SABR 미적용 보고가 가장 많은 축(무쿠키 사다리와 순서가 다른 이유).
          f=$(ls out/"${VID_ID}".* 2>/dev/null | grep -Ev "err|\.p[0-9]" | head -1)
          if { [ $rc -ne 0 ] || [ -z "$f" ]; } && [ "$IS_YT" = 1 ] && [ -n "$COOKIE_ARGS" ]; then
            #   ⚠ 260804 2차 실측 = tv·ios·기본·mweb·web_safari·android_vr 6종 전부 SABR. 그래서 yt-dlp가 아는
            #     클라이언트 12종을 전수 조회해 **안 써본 6종**을 앞에 붙였다(구판 사다리는 절반만 훑고 있었다).
            #     선두 = tv_downgraded — TVHTML5 **구버전(5.x)** + REQUIRE_AUTH. 구형 TV는 SABR을 못 하니
            #     유튜브가 legacy(비-SABR) 포맷 주소를 그대로 준다 = 인증 세션에서 가장 유력한 회피축.
            #     web_creator·tv_downgraded는 인증 필수라 **쿠키 사다리에서만** 의미가 있다(무쿠키 사다리엔 안 넣는다).
            for CL in "tv_downgraded" "web_embedded" "web_creator" "android" "web_music" "web" "tv" "ios" "" "mweb" "web_safari" "android_vr"; do
              if [ -n "$CL" ]; then EA="--extractor-args youtube:player_client=$CL"; else EA=""; fi
              [ "$CL" = "android_vr" ] && VB="-v" || VB=""
              echo "--- 재시도(쿠키): client=${CL:-기본}" >> out/err.log
              # shellcheck disable=SC2086
              yt-dlp $VB -f "$FMT" --merge-output-format mp4 --remux-video mp4 \
                --max-filesize "$MAXSIZE" --no-playlist --retries 3 --fragment-retries 5 \
                $EA $COOKIE_ARGS -o "out/${VID_ID}.%(ext)s" "$VID_URL" 2>> out/err.log
              rc=$?
              f=$(ls out/"${VID_ID}".* 2>/dev/null | grep -Ev "err|\.p[0-9]" | head -1)
              if [ $rc -eq 0 ] && [ -n "$f" ]; then break; fi
              rm -f out/"${VID_ID}".mp4 out/"${VID_ID}".mkv out/"${VID_ID}".webm out/"${VID_ID}".part 2>/dev/null
            done
          fi
          set -e

          f=$(ls out/"${VID_ID}".* 2>/dev/null | grep -Ev "err|\.p[0-9]" | head -1)
          if [ $rc -ne 0 ] || [ -z "$f" ]; then
            # 앱이 그대로 보여줄 사유 = ERROR 줄 우선(사다리 로그에서 원인만 추림) + 꼬리 일부
            { grep -a "^COOKIEFMT:" out/err.log | tail -1
              grep -a -i "SABR\|streaming experiment" out/err.log | tail -1
              grep -a "^ERROR" out/err.log | sort -u | tail -3
              echo "--- 진단"
              grep -aE "JS runtimes|PO Token Providers|JS Challenge Providers" out/err.log | sort -u | tail -3
              tail -c 300 out/err.log; } \
              > "out/${VID_ID}.err.txt" 2>/dev/null || echo "다운로드 실패" > "out/${VID_ID}.err.txt"
            gh release upload ytdl-drops "out/${VID_ID}.err.txt" -R "$REPO" --clobber
            echo "::warning::yt-dlp 실패 — err 자산 업로드"
            exit 0
          fi
          if [ "$f" != "out/${VID_ID}.mp4" ]; then mv "$f" "out/${VID_ID}.mp4"; fi
          gh release delete-asset ytdl-drops "${VID_ID}.err.txt" -R "$REPO" -y 2>/dev/null || true
          LIMIT=$((1900*1024*1024))   # 릴리스 파일당 2GB 하드 리밋 대비 여유 상한
          sz=$(stat -c%s "out/${VID_ID}.mp4")
          if [ "$sz" -le "$LIMIT" ]; then
            gh release upload ytdl-drops "out/${VID_ID}.mp4" -R "$REPO" --clobber
          else
            # 자동 분할 — 재인코딩 없는 스트림 복사(빠름·무손실), 각 편이 독립 재생되는 mp4
            dur=$(ffprobe -v error -show_entries format=duration -of default=nk=1:nw=1 "out/${VID_ID}.mp4" | cut -d. -f1)
            [ -z "$dur" ] && dur=3600
            segs=$(( sz / LIMIT + 2 ))   # 여유 1편 추가 = 키프레임 편차 흡수
            st=$(( dur / segs )); [ "$st" -lt 300 ] && st=300
            ffmpeg -v error -i "out/${VID_ID}.mp4" -c copy -map 0 -f segment -segment_time "$st" -reset_timestamps 1 "out/${VID_ID}.p%02d.mp4"
            rm "out/${VID_ID}.mp4"
            n=0
            for p in out/"${VID_ID}".p*.mp4; do gh release upload ytdl-drops "$p" -R "$REPO" --clobber; n=$((n+1)); done
            echo "{\"parts\":${n}}" > "out/${VID_ID}.done.json"
            gh release upload ytdl-drops "out/${VID_ID}.done.json" -R "$REPO" --clobber
            echo "분할 업로드 완료: ${n}편"
          fi

      - name: 7일 지난 자산 정리
        if: always()
        run: |
          rid=$(gh api "repos/$REPO/releases/tags/ytdl-drops" --jq .id 2>/dev/null) || exit 0
          cutoff=$(date -u -d '7 days ago' +%s)
          gh api "repos/$REPO/releases/$rid/assets" --paginate --jq '.[] | "\(.id) \(.created_at)"' | \
          while read -r aid ts; do
            t=$(date -u -d "$ts" +%s 2>/dev/null) || continue
            if [ "$t" -lt "$cutoff" ]; then gh api -X DELETE "repos/$REPO/releases/assets/$aid" >/dev/null || true; fi
          done
