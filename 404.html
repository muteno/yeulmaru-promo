<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>페이지를 찾을 수 없어요 — 예울마루 대시보드</title>
<!-- [접속 안정 260729] GitHub Pages 기본 404(영문 회색 화면) 대신 홈으로 돌아갈 길을 주는 최소 페이지.
     장애 상황에서 뜨는 화면이라 일부러 가볍게 만든다 — 외부 요청 0, 스크립트 0.
     색은 전부 루트 index.html :root 토큰 계승값(--accent #4A4DE7 · --text #1A1A2E · --bg 그라데이션 · --radius 16px). 새 색 없음. -->
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
     background:linear-gradient(135deg,#FDF6F3 0%,#F0EBF5 50%,#EBF0F8 100%);color:#1A1A2E}
.box{width:100%;max-width:420px;text-align:center;background:rgba(255,255,255,.78);
     border:1px solid rgba(0,0,0,.09);border-radius:16px;padding:40px 28px;
     box-shadow:0 8px 32px rgba(74,77,231,.08),0 2px 8px rgba(0,0,0,.04)}
.code{font-size:44px;font-weight:800;letter-spacing:2px;color:#4A4DE7;line-height:1.1}
h1{margin-top:14px;font-size:17px;font-weight:700}
p{margin-top:10px;font-size:14px;line-height:1.7;color:#888}
a{display:inline-block;margin-top:22px;padding:11px 26px;border-radius:10px;
  background:#4A4DE7;color:#fff;text-decoration:none;font-size:14px;font-weight:600}
</style>
</head>
<body>
<div class="box">
  <div class="code">404</div>
  <h1>이 주소에는 페이지가 없어요</h1>
  <p>주소가 바뀌었거나 잘못 입력됐을 수 있어요.<br>아래 버튼으로 대시보드 홈으로 가면 됩니다.</p>
  <a href="/">대시보드 홈으로</a>
</div>
</body>
</html>
