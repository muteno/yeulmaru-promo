/* ============================================================
   예울마루 프로모 — UI 통일 토큰 (yeulmaru-ui.css)
   ADDITIVE: 기존 클래스/여백/픽토그램/PIN/필터/챗봇/빗금/스크롤바는 건드리지 않음.
   새 컴포넌트는 .btn / 아래 토큰을 쓴다. 색 기준값(--accent 등)은 기존 :root 사용.
   ============================================================ */
:root{
  --neutral:#EEEDF3; --neutral-d:#E1DFEC; --neutral-text:#6B6B7B;
  --r-btn:10px; --r-pop:16px; --r-modal:20px;
  --elev:0 20px 56px rgba(74,77,231,.16), 0 6px 18px rgba(26,26,46,.07);
  --backdrop:rgba(26,26,46,.42);
  --glass-surface:rgba(255,255,255,.78);
  --glass-menu:rgba(255,255,255,.45);   /* 호버 세부메뉴 드롭다운 반투명 유리(운영자 승인 260709 · 45%) */
  --glass-bd:var(--glass);
  --z-sticky:10; --z-nav:90; --z-dropdown:1000; --z-modal:2000; --z-confirm:2100; --z-toast:3000;
  --c1:#4A4DE7; --c2:#D88455; --c3:#1A6B3C; --c4:#C02872; --c5:#2D8AB3; --c6:#F5B400;
  --kakao:#F5B400;
  /* #7 행 밀도 토큰 (일정관리 보드 셀 현재 값 그대로 — 픽셀 무변경, 단일 출처) */
  --cell-pad-y:10px; --cell-pad-x:12px; --cell-fs:13px;
}
.btn{font-family:inherit;font-weight:700;border:1px solid transparent;
  border-radius:var(--r-btn);cursor:pointer;line-height:1;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  white-space:nowrap;transition:transform .15s,box-shadow .15s,background .15s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn--sm{padding:7px 14px;font-size:12px;border-radius:8px}
.btn--md{padding:10px 20px;font-size:13px}
.btn--lg{padding:13px 26px;font-size:14.5px}
.btn--primary{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(74,77,231,.16)}
.btn--primary:hover{background:#3d40d4;box-shadow:0 3px 11px rgba(74,77,231,.2)}
.btn--neutral{background:var(--neutral);color:var(--neutral-text)}
.btn--neutral:hover{background:var(--neutral-d)}
.btn--danger{background:var(--danger-btn);color:#fff;box-shadow:0 2px 8px rgba(226,75,74,.16)}
.btn--danger:hover{background:#C73F3E}
.btn--ghost{background:transparent;color:var(--accent);border-color:rgba(74,77,231,.25)}
.btn--ghost:hover{background:rgba(74,77,231,.06)}
.fill-accent:not(:placeholder-shown){border-color:var(--accent)!important;background:#fff!important}
.u-backdrop{position:fixed;inset:0;background:var(--backdrop);
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;z-index:var(--z-modal)}
.u-surface{background:var(--glass-surface);border:1px solid var(--glass-bd);
  -webkit-backdrop-filter:blur(32px) saturate(170%);backdrop-filter:blur(32px) saturate(170%);
  border-radius:var(--r-modal);box-shadow:var(--elev)}
.u-pop{background:var(--glass-surface);border:1px solid var(--glass-bd);
  -webkit-backdrop-filter:blur(28px) saturate(160%);backdrop-filter:blur(28px) saturate(160%);
  border-radius:var(--r-pop);box-shadow:var(--elev);z-index:var(--z-dropdown)}
/* 공용 빈 상태 카드(UX 브리프 #6) — 필터 0건일 때 */
.u-empty{text-align:center;padding:44px 24px;color:var(--neutral-text)}
.u-empty .ico{font-size:30px;margin-bottom:10px;opacity:.7}
.u-empty .msg{font-size:13.5px;font-weight:600;margin-bottom:14px}
/* ===== 판매·사업현황 분석 보드 (beta) — .ana-* 전용 네임스페이스 ===== */
/* (.ana-tabs/.ana-tab 규칙은 260710 카테고리 스택 전환으로 참조 0 → 제거 — 분신술 감사4 LOW) */
.ana-seg{display:inline-flex;border:1.5px solid var(--accent);border-radius:9px;overflow:hidden}
.ana-seg button{padding:5px 13px;border:0;background:#fff;color:var(--accent);font-family:inherit;font-size:11.5px;font-weight:700;cursor:pointer;transition:background .15s}
.ana-seg button+button{border-left:1.5px solid var(--accent)}
.ana-seg button.on{background:var(--accent);color:#fff}
.ana-chip{padding:4px 11px;border-radius:7px;border:1.5px solid var(--glass-bd);background:var(--glass-surface);backdrop-filter:blur(8px);box-shadow:var(--glass-shadow);color:var(--text);font-family:inherit;font-size:11px;font-weight:600;cursor:pointer;transition:all .15s}
.ana-chip:hover{border-color:var(--accent);color:var(--accent)}
.ana-chip.on{border-color:var(--accent);background:rgba(74,77,231,0.08);color:var(--accent)}
.ana-sel{padding:5px 9px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:11.5px;color:var(--text);background:var(--surface-solid);cursor:pointer}
.ana-tbl{width:100%;border-collapse:collapse;font-size:13px}
.ana-tbl thead td{padding:9px 11px;color:#888;font-size:11px;font-weight:700;border-bottom:2px solid #eee;text-align:left;white-space:nowrap}
.ana-tbl tbody tr{border-bottom:1px solid #f0f0f0;transition:background .12s}
.ana-tbl tbody tr.clk{cursor:pointer}
.ana-tbl tbody tr.clk:hover{background:rgba(74,77,231,0.045)}
.ana-tbl tbody td{padding:9px 11px;vertical-align:middle}
.ana-row-name{font-weight:600;color:#222}
.ana-row-name sub{display:block;font-size:10.5px;color:#999;font-weight:500;margin-top:1px}
.ana-badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10.5px;font-weight:700;white-space:nowrap}
.ana-badge.m{background:rgba(15,139,76,0.1);color:#0F8B4C}
.ana-badge.f{background:rgba(224,134,0,0.12);color:#C77800}
.ana-badge.n{background:#f0f0f3;color:#999}
.ana-kbox{background:#fafaff;border:1px solid #ececf7;border-radius:14px;padding:16px 18px;margin-bottom:16px}
.ana-kpis{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.ana-kpi{flex:1;min-width:108px;padding:11px 13px;background:#fff;border:1px solid #eee;border-radius:11px}
.ana-kpi .lab{font-size:10.5px;color:#888;font-weight:600;margin-bottom:5px}
.ana-kpi .val{font-size:20px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.1}
.ana-kpi .sub2{font-size:11px;font-weight:600;margin-top:3px}
.ana-line{display:flex;align-items:flex-start;gap:7px;font-size:12.5px;color:#444;margin:5px 0;line-height:1.45}
.ana-line .ic{flex-shrink:0;font-size:13px}
.ana-next{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:7px 14px;border-radius:10px;background:var(--accent);color:#fff;font-size:12.5px;font-weight:700}
.ana-tray{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0 10px}
.ana-pchip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:11px;border:1.5px solid var(--glass-bd);background:var(--glass-surface);backdrop-filter:blur(8px);box-shadow:var(--glass-shadow);font-size:11.5px;font-weight:600;color:var(--text);cursor:grab;user-select:none;transition:all .16s}
.ana-pchip:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.ana-pchip.on{border-color:var(--accent);background:rgba(74,77,231,0.08);color:var(--accent)}
.ana-pchip .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.ana-pchip:active{cursor:grabbing}
#ana-drill-chart.ana-over{outline:2.5px dashed var(--accent);outline-offset:-3px;border-radius:14px;background:rgba(74,77,231,0.03)}
.ana-cmp-tbl{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
.ana-cmp-tbl td{padding:6px 9px;border-bottom:1px solid #f2f2f2}
.ana-xbtn{display:inline-flex;gap:3px}
.ana-xbtn button{padding:3px 9px;border:1.5px solid var(--glass-bd);background:var(--glass-surface);backdrop-filter:blur(8px);box-shadow:var(--glass-shadow);border-radius:7px;font-family:inherit;font-size:10.5px;font-weight:600;color:var(--text);cursor:pointer}
.ana-xbtn button.on{border-color:var(--accent);background:rgba(74,77,231,0.08);color:var(--accent)}
.ana-svg-wrap{border:1px solid #f0f0f0;border-radius:12px;padding:10px 8px 4px;background:#fff;overflow-x:auto}
.ana-why td.exp{cursor:pointer;color:var(--accent);font-weight:600;user-select:none}
.ana-why-note{font-size:11.5px;color:#666;background:#fafafa;border-radius:8px;padding:8px 11px;line-height:1.5}
.ana-bcards{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ana-bcard{flex:1;min-width:130px;padding:14px 16px;background:#fafafa;border-radius:12px;border:1px solid #eee}
.ana-bcard .lab{font-size:11px;color:#888;font-weight:600;margin-bottom:6px}
.ana-bcard .val{font-size:22px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.ana-bcard .yoy{font-size:11px;font-weight:700;margin-top:4px}
.ana-mtx{width:100%;border-collapse:collapse;font-size:13px}
.ana-mtx td,.ana-mtx th{padding:11px 12px;border:1px solid #eee;text-align:center}
.ana-mtx th{background:#fafafa;color:#666;font-size:11.5px;font-weight:700}
.ana-mtx td.rh{text-align:left;font-weight:700;color:#333;background:#fcfcfe}
.ana-mtx td.tot{background:#fafaff;font-weight:700}
.ana-mtx .cn{font-weight:700;color:#222}
.ana-mtx .co{font-size:11px;color:#888;display:block;margin-top:2px}
.ana-back{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border:1.5px solid var(--glass-bd);border-radius:9px;background:var(--glass-surface);backdrop-filter:blur(8px);box-shadow:var(--glass-shadow);font-family:inherit;font-size:12px;font-weight:600;color:var(--text);cursor:pointer;margin-bottom:14px}
.ana-back:hover{border-color:var(--accent);color:var(--accent)}
.ana-dl{padding:6px 13px;border:1.5px solid var(--accent);border-radius:9px;background:rgba(74,77,231,0.06);color:var(--accent);font-family:inherit;font-size:11.5px;font-weight:700;cursor:pointer}
/* ===== 예매 프로세스 보드 — .bp-* 전용 네임스페이스 (색 전부 루트 토큰 계승, 새 색 0) =====
   v2 다이어그램 에디터: 보기(팬·줌·문의 배지) + 편집(도형·프로세스·화살표·텍스트·정렬·undo).
   툴바 버튼 = .fbar-seg 글래스 시각언어 계승 · 오버레이(핸들·앵커)는 스크린 좌표라 줌과 무관 크기. */
/* [260710 운영자] 도화지 모달화 — 전체 뷰포트 불투명 → 메인 위 모달 카드(백드롭 dim) + 전체화면 토글(.full = 오늘의 풀뷰포트 복원).
   값 전부 토큰 계승(--backdrop·--r-modal·--elev·연간 캘린더 모달 96vw×92vh 전례) — 신규 raw hex 0. .bp-pop은 카드 밖 형제(뷰포트 좌표 보존). */
.bp-bg{position:fixed;inset:0;background:var(--backdrop);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:var(--z-modal);display:flex;align-items:center;justify-content:center}
.bp-card{position:relative;width:96vw;max-width:1400px;height:92vh;background:var(--surface-solid);border-radius:var(--r-modal);box-shadow:var(--elev);display:flex;flex-direction:column;overflow:hidden;animation:fadeUp .25s ease}
.bp-bg.full{background:var(--surface-solid);backdrop-filter:none;-webkit-backdrop-filter:none}
.bp-bg.full .bp-card{width:100vw;max-width:none;height:100vh;border-radius:0;box-shadow:none;animation:none}
/* [260710 운영자] 에니어그램 모달화 — 새 탭 → 메인 위 모달(iframe 임베드) + 전체화면 토글. 도화지와 동일 셸(신규 hex 0). */
.enn-modal{width:96vw;max-width:1400px;height:92vh;max-height:92vh;padding:0;position:relative;display:flex;flex-direction:column;overflow:hidden;background:var(--surface-solid)}
.enn-frame{flex:1;width:100%;border:0;display:block;background:var(--surface-solid)}
.enn-btns{position:absolute;top:9px;right:22px;display:inline-flex;gap:8px;z-index:30}
.modal-bg.enn.full{background:var(--surface-solid);backdrop-filter:none;-webkit-backdrop-filter:none}
.modal-bg.enn.full .enn-modal{width:100vw;height:100vh;max-width:none;max-height:none;border:0;border-radius:0;box-shadow:none}
.bp-hd{display:flex;align-items:center;gap:10px;padding:9px clamp(14px,3vw,26px);border-bottom:1px solid var(--border);flex:none;flex-wrap:wrap}
.bp-hd b{font-size:15px;letter-spacing:-.01em;color:var(--accent)}
.bp-hd .sp{flex:1}
/* [260710 운영자] 도화지 전체화면 = nav가 가려져 로그인 계정이 안 보임 → 헤더 우측(공유범위 좌측)에 계정명 노출. 전체화면일 때만 표시. 색·형태 토큰 계승(신규 hex 0). */
.bp-user{display:none;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--neutral-text);white-space:nowrap;flex:none;margin-right:2px}
.bp-bg.full .bp-user{display:inline-flex}
.bp-user svg{opacity:.7;flex:none}
.bp-x{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--glass-bd);background:var(--glass-surface);backdrop-filter:blur(8px);box-shadow:var(--glass-shadow);color:var(--text);font-size:15px;line-height:1;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.bp-x:hover{border-color:var(--accent);color:var(--accent)}
.bp-tools{display:flex;align-items:center;gap:5px;padding:7px clamp(10px,2vw,24px);border-bottom:1px solid var(--border);flex:none;flex-wrap:wrap}
.bp-tbtn{padding:7px 11px;border-radius:var(--r-btn);border:1.5px solid var(--glass-bd);background:var(--glass-surface);backdrop-filter:blur(8px);box-shadow:var(--glass-shadow);color:var(--text);font-family:inherit;font-size:12px;font-weight:600;line-height:1;cursor:pointer;transition:background .15s,border-color .15s,color .15s;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.bp-tbtn:hover{border-color:var(--accent);color:var(--accent)}
.bp-tbtn.on{background:var(--accent);border-color:var(--accent);color:var(--surface-solid);box-shadow:0 2px 8px rgba(74,77,231,.2)}
.bp-tbtn:disabled{opacity:.35;cursor:default;pointer-events:none}
.bp-tkey{font-size:9px;font-weight:800;color:var(--dim);border:1px solid var(--border2);border-radius:4px;padding:1.5px 4px;line-height:1}
.bp-tbtn.on .bp-tkey{color:var(--surface-solid);border-color:rgba(255,255,255,.5)}
.bp-tsep{width:1px;height:18px;background:var(--border2);margin:0 4px;flex:none}
.bp-vp{flex:1;position:relative;overflow:hidden;background:var(--surface-solid);background-image:radial-gradient(rgba(26,26,46,.05) 1px,transparent 1px);background-size:16px 16px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:default}
.bp-vp.pan{cursor:grab}.bp-vp.panning{cursor:grabbing}.bp-vp.place{cursor:crosshair}
.bp-world{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0}
.bp-edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.bp-edges .lb{font-size:10.5px;font-weight:700;fill:var(--neutral-text);paint-order:stroke;stroke:var(--surface-solid);stroke-width:3px;text-anchor:middle;font-family:inherit}
.bp-nodes{position:absolute;left:0;top:0}
.bpn{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:700;line-height:1.3;padding:4px 3px;border:1.5px solid transparent;word-break:keep-all;box-sizing:border-box;border-radius:10px;pointer-events:none}
.bpn .tx{position:relative;white-space:pre-wrap;width:100%;padding:0 2px;box-sizing:border-box;outline:none;min-height:1em}
.bpn .tx[contenteditable]{cursor:text;pointer-events:auto}
.bpn svg.shp{position:absolute;inset:0;width:100%;height:100%}
.bpn.frame{align-items:stretch;justify-content:flex-start;padding:0}
.bpn.frame .flab{position:absolute;top:8px;right:14px;font-size:12px;font-weight:800;letter-spacing:.03em;white-space:pre-wrap;text-align:right}
.bpn.frame .flab.bl{top:auto;bottom:8px;left:0;right:0;text-align:center}
.bpn.step{flex-direction:row;justify-content:flex-start;text-align:left;gap:7px;padding:3px 8px;border-radius:8px;background:rgba(255,255,255,.9);color:var(--accent)}
.bpn.step .tx{width:auto;flex:1}
.bpn .bq-c{position:absolute;top:-11px;right:-11px}
.bpn .bp-imwrap{position:absolute;inset:0;overflow:hidden;border-radius:inherit;pointer-events:none}
.bpn .bp-im{width:100%;height:100%;object-fit:cover;display:block}
.bpn .bp-emb{width:100%;height:100%;border:0;display:block;background:var(--neutral);pointer-events:none}
.bp-vp:not(.edit) .bpn .bp-emb{pointer-events:auto}
.bpn.hasmedia .tx,.bpn.hasmedia .flab{text-shadow:0 1px 2px rgba(0,0,0,.55)}
.bp-q{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--accent);background:var(--surface-solid);color:var(--accent);font-size:13px;font-weight:800;line-height:1;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;font-family:inherit;box-shadow:var(--glass-shadow);transition:transform .15s;pointer-events:auto}
.bp-q:hover{transform:scale(1.12)}
.bp-q.has{background:var(--accent);color:var(--surface-solid);border-color:var(--accent);font-size:11.5px}
#bp-ovl{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#bp-ovl svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
.bp-selbox{position:absolute;border:1.5px solid var(--accent);border-radius:2px;pointer-events:none}
.bp-selbox.hv{opacity:.45}
.bp-hdl{position:absolute;width:9px;height:9px;background:var(--surface-solid);border:1.5px solid var(--accent);border-radius:2.5px;box-sizing:border-box;pointer-events:auto}
.bp-anc{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--surface-solid);border:1.5px solid var(--accent);box-sizing:border-box;pointer-events:auto;cursor:crosshair;transition:transform .12s,background .12s}
.bp-anc:hover{transform:scale(1.35);background:var(--accent-light)}
.bp-marq{position:absolute;border:1px solid var(--accent);background:var(--accent-glow);pointer-events:none}
.bp-gd{position:absolute;background:var(--accent);opacity:.7;pointer-events:none}
.bp-props{position:absolute;right:12px;top:12px;width:218px;max-height:calc(100% - 24px);overflow-y:auto;background:var(--surface-solid);border:1px solid var(--border);border-radius:var(--r-pop);box-shadow:var(--elev);padding:12px 13px;display:flex;flex-direction:column;gap:10px}
.bp-props .pl{font-size:10px;font-weight:800;color:var(--dim);letter-spacing:.05em}
.bp-fills{display:flex;gap:5px;flex-wrap:wrap}
.bp-fchip{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--border2);cursor:pointer;box-sizing:border-box;padding:0}
.bp-fchip.on{outline:2px solid var(--accent);outline-offset:1.5px}
.bp-seg{display:flex;gap:4px;flex-wrap:wrap}
.bp-seg button{flex:1;min-width:0;padding:6px 4px;border-radius:7px;border:1.5px solid var(--glass-bd);background:var(--glass-surface);color:var(--text);font-family:inherit;font-size:10.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:border-color .12s,background .12s,color .12s}
.bp-seg button:hover{border-color:var(--accent);color:var(--accent)}
.bp-seg button.on{background:var(--accent);border-color:var(--accent);color:var(--surface-solid)}
.bp-pin{font-family:inherit;font-size:12px;color:var(--text);border:1.5px solid var(--border2);border-radius:7px;padding:6px 8px;background:var(--surface-solid);width:100%;box-sizing:border-box}
.bp-pin:focus{outline:none;border-color:var(--accent)}
.bp-foot{display:flex;align-items:center;gap:10px;padding:6px clamp(10px,2vw,24px);border-top:1px solid var(--border);flex:none;font-size:11px;color:var(--dim);flex-wrap:wrap;min-height:26px}
.bp-foot .sp{flex:1}
.bp-zbtn{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--glass-bd);background:var(--glass-surface);color:var(--text);font-size:13px;font-weight:700;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-family:inherit;padding:0}

.bp-carat{width:26px;height:30px;border:0;background:none;color:var(--dim);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;padding:0;flex:none;transition:color .15s,background .15s}

.bp-ddpic svg,.bp-carat svg{display:block}

.bp-ddpic.tm{color:var(--accent)}

.bp-pop{position:absolute;width:min(320px,92vw);background:var(--surface-solid);border:1px solid var(--border);border-radius:var(--r-pop);box-shadow:var(--elev);padding:13px 14px;z-index:var(--z-dropdown);display:none;text-align:left}

.bp-list{list-style:none;margin:0 0 10px;padding:0;max-height:240px;overflow-y:auto}
.bp-item{padding:8px 2px;border-top:1px solid var(--border)}

.ana-dl:hover{background:rgba(74,77,231,0.12)}
.ana-hm-cell{position:relative}
.ana-hm-cell.clk{cursor:pointer}
.ana-sec{font-size:14px;font-weight:700;color:#333;margin:6px 0 10px}
/* [260710 운영자] 판매현황 스크린1 = 공연·전시·교육 중분류 스택 헤더(탭 폐지) — 색·형태 전부 토큰 계승 */
.ana-cat-hd{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:800;color:var(--text);margin:2px 0 10px}
.ana-cat-hd::before{content:'';width:4px;height:14px;border-radius:2px;background:var(--accent)}
.ana-pop{position:fixed;z-index:100050;background:#fff;border:1px solid #e0e0e0;border-radius:12px;box-shadow:0 12px 36px rgba(0,0,0,0.18);padding:14px 16px;max-width:320px;font-size:12px;color:#444;line-height:1.55}
/* #8 일정관리 보드 thead 고정 — 본문 스크롤 중 헤더 행 상단 고정. 불투명 배경(rgba 0.95 → 솔리드)으로 행 비침 방지. 둥근 상단 모서리는 wrapper overflow:hidden 대신 코너 th radius로 유지. 컬럼 폭/리사이즈 핸들 불변. */
table.promo-board-table thead th{position:sticky;top:0;z-index:7;background:var(--accent)}
table.promo-board-table thead th:first-child{border-top-left-radius:11px}
table.promo-board-table thead th:last-child{border-top-right-radius:11px}
/* === UX 브리프 #4 — 필터·정렬 바 통일 (.fbar-*). 판매/사업/일정관리 보드 공용 칩·세그.
   상태 명료화: 선택 = accent 채움(흰 글씨) · 비선택 = 흰 배경·중립 글씨. .nb-chip.on / .ana-seg button.on 과 동일 시각언어.
   ⚠️ 필터 LOGIC·state·handler 불변 — 이 클래스는 컨트롤 마크업/스타일만 통일한다. */
.fbar-lbl{font-size:11px;color:var(--neutral-text);font-weight:600;margin-right:2px}
/* 세그먼트(상호배타) — 상태탭·수익성·회차·진행일. .fbar-seg 안의 button 들이 한 그룹. */
.fbar-seg{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center}
.fbar-seg button{padding:6px 13px;border-radius:8px;border:1.5px solid var(--glass-bd);background:var(--glass-surface);backdrop-filter:blur(8px);box-shadow:var(--glass-shadow);color:var(--text);font-family:inherit;font-size:12px;font-weight:600;line-height:1;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
.fbar-seg button:hover{border-color:var(--accent);color:var(--accent)}
.fbar-seg button.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(74,77,231,.2)}
/* 단일 칩(다중 토글) — 같은 시각언어, 선택 시 accent 채움. 내장 체크박스 허용. */
.fbar-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:8px;border:1.5px solid var(--glass-bd);background:var(--glass-surface);backdrop-filter:blur(8px);box-shadow:var(--glass-shadow);color:var(--text);font-family:inherit;font-size:12px;font-weight:600;line-height:1;cursor:pointer;transition:background .15s,border-color .15s,color .15s;user-select:none}
.fbar-chip:hover{border-color:var(--accent);color:var(--accent)}
.fbar-chip.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(74,77,231,.2)}
.fbar-chip input{width:14px;height:14px;margin:0;flex-shrink:0;cursor:pointer;accent-color:var(--accent)}
.fbar-chip.on input{accent-color:#fff}
.fbar-chip.lock{cursor:not-allowed;opacity:.85}
/* ===== 판매 레일 — 메인 캘린더 + 판매중 사업현황 (.srail-* 네임스페이스).
   데이터·표기 = 판매현황(_salesBuild)+분석 보드(.ana-*) 스크린1·드릴 KPI 계승(추이·어제대비·목표 대비).
   구조·수치 = 운영자 260710 플레이그라운드 확정값(docs/reports/260710_판매레일구조표현_플레이그라운드.html 선택값 복사 회신):
   제목 = 박스 밖 월헤더 라인 중앙 유리 스트립 · 요약/기준일/분석/새로고침 숨김 · 박스 유리 α.20/blur24/sat160/보더 α.30(운영자 확정 갱신).
   색 전부 기존 토큰·white alpha 변주 — 신규 raw hex 0. */
/* 캘린더·판매현황 뒤 배경 레이어 — 여수 예울마루 항공사진(하위 15% crop본)을 opacity 25%로 은은히 깔고, 자른 사진 70% 높이부터 위로 갈수록 살살 페이드아웃. #body-wrap isolation:isolate로 이 컨테이너에 격리 → 기존 --bg 그라디언트 위·콘텐츠(캘린더/레일) 아래(z-index:-1). 배경 이미지·mask alpha = 색 창작 아님(팔레트 무관) */
#body-wrap::before{content:'';position:absolute;inset:0;z-index:-1;pointer-events:none;background:url("image/bg-yeulmaru.webp") center bottom/cover no-repeat;opacity:.56;filter:saturate(1.65);-webkit-mask-image:linear-gradient(to top,rgba(0,0,0,1) 0%,rgba(0,0,0,1) 25%,rgba(0,0,0,0) 73%);mask-image:linear-gradient(to top,rgba(0,0,0,1) 0%,rgba(0,0,0,1) 25%,rgba(0,0,0,0) 73%)}   /* 플레이그라운드 260713 선택값 배선 — opacity .25→.56·saturate 1.65·mask 시작25%/투명도달73%(살살 페이드) */
#sales-rail{width:50%;min-width:300px;flex-shrink:0;padding:18px 20px 24px 0;display:flex;flex-direction:column}   /* [260723e 운영자 선택값 — 두 모드 공통] 좌우 1:1(41%→50%) · 상단 18 · 바깥 20(구 34) */
@media(min-width:1201px){#main-area{padding-right:15px !important}}   /* 캘린더↔레일 간격 15(선택값 · 레일 표시 폭에서만 — 인라인을 스코프 오버라이드) */
/* 타이틀 존 — 운영자 260710 "판매 현황 글자를 흰 헤더 행으로": 유리 스트립 폐지, 존은 빈 스페이서로 유지(높이 = hdr 실높이 → 글래스 박스 top이 요일바 top과 일치하는 정렬 로직 불변) */
.srail-ttlzone{display:flex;align-items:center;justify-content:center;flex-shrink:0;min-width:0;margin-bottom:1px}
.srail-ttltext{font-size:14px;font-weight:800;color:var(--accent);white-space:nowrap}   /* [260723 운영자] 기본 노출 타이틀(연간 실적·판매 현황) = 강조색 */
/* 흰 헤더 행 — 캘린더 요일바(.cal-head-wrap) 미러(운영자 260710 "요일 nav행을 판매현황에도 + 그 행에 요약줄"). 높이 = 요일바 실높이(_srailAlignTop 동적, 폴백 47px)
   운영자 260710 후속: 좌측 = 「판매 현황」 타이틀(+건수) · 그 옆 = 「전일 대비 ~」 요약 */
.srail-head{flex-shrink:0;min-height:47px;display:flex;align-items:center;gap:10px;padding:1px 16px 0;background:rgba(255,255,255,.9);backdrop-filter:blur(11px);-webkit-backdrop-filter:blur(11px);border-bottom:1px solid rgba(0,0,0,.07);overflow:hidden}   /* pad-top 1 = 글자 세로중앙 -0.5px 보정(운영자 260710 픽셀 실측 — 배경·높이·모서리 불변) */
/* 배경 = 좌측 캘린더(.cal) 글래스 계승 — 좌우 통일감(운영자 260710). 카드 간격(.srail-card margin)·좌우 여백(.srail-body padding)은 유지 */
.srail{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;margin-top:-1px;background:rgba(255,255,255,.35);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);border:1px solid rgba(255,255,255,.7);border-radius:var(--radius-lg);box-shadow:var(--glass-shadow);overflow:hidden;animation:srailIn .4s ease}   /* [260723e 운영자 선택값 — 두 모드 공통] 유리 흰α .53→.35 · 라운드 20 · [260723 운영자] blur 15→7 = 연간실적 _BIZM_BOX·캘린더 .cal 블러와 통일 */
.srail-hd{display:flex;align-items:center;gap:7px;padding:14px 16px 9px;flex-shrink:0}
.srail-tt{font-size:14.5px;font-weight:800;color:var(--text)}
.srail-cnt{font-size:10.5px;font-weight:800;color:var(--accent);background:transparent;border:1px solid rgba(74,77,231,.18);border-radius:999px;padding:1px 8px;font-variant-numeric:tabular-nums}   /* [260710 운영자 선택값] 배지 배경 .08→투명(테두리만) */
.srail-asof{font-size:10.5px;color:var(--dim);font-weight:600;margin-left:auto;white-space:nowrap}
.srail-sum{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--neutral-text);font-weight:600;flex-shrink:0;margin-left:7px}   /* [260710 운영자 선택값] 11→12 · 좌측 간격 = head gap 10 + 7 = 17px(현행 10의 1.7배 지시) */
.srail-body{flex:1;overflow-y:auto;padding:4px 0 0;min-height:0;scrollbar-width:thin;-ms-overflow-style:none;scrollbar-color:transparent transparent}
/* [260710 운영자] 판매 레일 스크롤바 = 오버레이형(캘린더 .c-inner 계승) — 전역 13px 보더트랙+화살표 칩(구획감·마지막 카드 덮음) 폐지.
   평소 폭0 = 카드·구분선이 우측 끝까지 꽉 참(운영자 "우측까지 다 채우고") · 레일 호버 시에만 얇은 플로팅 썸이 카드 위로("저거 위에 스크롤"). 색·형태 전부 .c-inner 계승(신규 hex 0). */
.srail-body::-webkit-scrollbar{width:7px;height:0;background:transparent}
.srail-body::-webkit-scrollbar-button{display:none;width:0;height:0}
.srail:hover .srail-body{scrollbar-color:rgba(0,0,0,0.15) transparent}
.srail:hover .srail-body::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.15)}
.srail-body::-webkit-scrollbar-thumb{background:transparent;border:0;background-clip:border-box;border-radius:999px}
.srail-body::-webkit-scrollbar-track{background:transparent;border:none;margin:0}
/* [260724 운영자] 2×2 우하단 = 「사업 판매현황」 자동전환(5초) 상세 — .srail 유리박스 미러(구조·색·블러 계승) · biz(실적) 모드 전용 노출 · 좌 전체실적표와 세로 대칭
   .srail을 좌 연간실적 박스 높이로 핀(_srailAlignTop)한 뒤 남는 아래공간을 flex:1로 흡수 = 빈 우하단 채움. 스크롤·헤더·토글바 전부 기존 부품 계승(신규 색·토큰 0). */
#srail-uha{flex:1 1 0;min-height:180px;position:relative;display:none;flex-direction:column;margin-top:12px;background:rgba(255,255,255,.35);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);border:1px solid rgba(255,255,255,.7);border-radius:var(--radius-lg);box-shadow:var(--glass-shadow);overflow:hidden;animation:srailIn .4s ease}
.srail-uha-body{flex:1;overflow-y:auto;min-height:0;padding:4px 0 0;scrollbar-width:thin;-ms-overflow-style:none;scrollbar-color:transparent transparent}
.srail-uha-body::-webkit-scrollbar{width:7px;height:0;background:transparent}
.srail-uha-body::-webkit-scrollbar-button{display:none;width:0;height:0}
#srail-uha:hover .srail-uha-body{scrollbar-color:rgba(0,0,0,0.15) transparent}
#srail-uha:hover .srail-uha-body::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.15)}
.srail-uha-body::-webkit-scrollbar-thumb{background:transparent;border:0;border-radius:999px}
.srail-uha-body::-webkit-scrollbar-track{background:transparent;border:none;margin:0}
.srail-uha-auto{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--dim);font-weight:600;white-space:nowrap;flex-shrink:0}
.srail-uha-pd{width:6px;height:6px;border-radius:50%;background:var(--green);animation:uhaPulse 2s infinite}
#srail-uha[data-paused="1"] .srail-uha-pd{background:var(--muted);animation:none}
@keyframes uhaPulse{0%,100%{opacity:1}50%{opacity:.35}}
/* [260731 운영자] 하단 슬라이드 토글(.srail-uha-bar) 규칙 폐지 — 마크업과 함께 제거(우 카드 하단선을 좌 「전체 실적표」에 맞춤). 넘김 = 카드 헤더 .bizm-yrnav */
/* [260724 운영자 3차] 우하단 = 좌 연간실적 통 미러 — 글래스 헤더(_bizmHead 톤) + KPI 스트립(.bizm-strip 계승) + 차트 카드(.bizm-card 계승, 1/3 KPI + 2/3 차트 우측정렬) */
.uha-inner{padding:2px 18px 6px}   /* [260725] 하단 14→6 · 좌 전체 실적표와 세로 폭 맞춤 */
#srail-uha .uha-inner>.bizm-card:last-child{margin-bottom:0}   /* [260725] 통 안 마지막 카드 = 바깥 여백 제거 */
#srail-uha .srail-dots{margin-bottom:6px}   /* [260725] 상세 슬라이드 점줄 = 26→6(이 통 안에서만 · .srail 캐러셀 점줄은 무접촉) */
.uha-head{display:flex;align-items:baseline;gap:10px;padding:10px 2px 12px;flex-wrap:wrap}
.uha-nm{font-size:16.5px;font-weight:800;color:var(--text);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:100%}
.uha-sub{font-size:12px;color:var(--neutral-text);font-weight:500;white-space:nowrap}
.uha-hr{margin-left:auto;font-size:12px;color:var(--neutral-text);font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:10px}
.uha-hr b{color:var(--accent);font-weight:800}
.uha-auto{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--dim);font-weight:600}
.uha-chartrow{display:flex;gap:12px;align-items:stretch;padding:6px 10px 8px}
.uha-kpicol{flex:0 0 44%;max-width:44%;min-width:0;display:grid;grid-template-columns:1fr 1fr;gap:9px;align-content:center}   /* [260725 운영자] 구 .bizm-strip 4칸(누적 판매석 등)을 차트 좌측 글자영역으로 흡수 → 2열 6칸 */
.uha-kpi{background:var(--glass-surface);border:1px solid var(--glass-bd);border-radius:var(--radius);box-shadow:var(--glass-shadow);padding:11px 12px;position:relative;overflow:hidden;min-width:0}   /* [260725] 6칸 밀도 — 패딩 13/14→11/12 */
.uha-kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--kpitok,var(--accent))}
.uha-kpi .lab{font-size:10.5px;color:var(--dim);font-weight:600;margin-bottom:5px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uha-kpi .val{font-size:17px;font-weight:800;color:var(--kpitok,var(--accent));font-variant-numeric:tabular-nums;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}   /* [260725] 6칸 밀도 — 20→17 · 긴 값 말줄임 */
.uha-chart{flex:1 1 auto;min-width:0;display:flex;align-items:center}
.uha-chart svg{width:100%;height:auto;display:block}
/* [260710 운영자] 카드 도형 한 레이어 내림 — 흰 전경 도형(배경 .85·테두리·그림자·radius) 제거 = 캘린더 활성 셀(rgba(255,255,255,0), .c 계승)처럼
   글래스 위에 글자 직접 + 구분선(rgba(0,0,0,.07) = .week 주 구분선 계승)으로만 구분. 박스(.srail)·헤더(.srail-head)는 불변(운영자 "건들지 마"). */
.srail-card{background:rgba(255,255,255,0);border:none;border-bottom:1px solid rgba(0,0,0,.07);border-radius:0;box-shadow:none;padding:15px 16px;margin-bottom:0;cursor:pointer;transition:background .15s}
/* [260710 운영자] 집계 전(오픈 후 입력 0건) 카드 = read-only 음영 + 흰 글자 오버레이 — 딤 = --backdrop(26,26,46) 알파 변주 §3.5② · 글자 = --surface-solid */
.srail-card.ro{position:relative}
.srail-ro{position:absolute;inset:0;border-radius:inherit;background:rgba(26,26,46,.34);display:flex;align-items:center;justify-content:center;color:var(--surface-solid);font-size:14px;font-weight:400;text-align:center;line-height:1.5;padding:0 16px;pointer-events:none}   /* [260711 운영자] 레일 목록 화면 볼드 전면 해제(700·800→400, 카드·차트·범례·AI예상) — 색이 이미 역할 구분, 굵기 강조 중복 제거. 600·500은 유지 */
.srail-card:last-child{border-bottom:none}
.srail-body>.srail-card:first-child{padding-top:8.7px}   /* [260711 운영자] 첫 카드(브런치 콘서트)↔범례 밴드 간격 = 기존 19px(body pad-top 4 + card pad-top 15)의 2/3 ≈ 12.7px로 축소 (card pad-top 15→8.7, body 4 유지) */
.srail-card:hover{background:var(--past-bg)}
.srail-r1{display:flex;align-items:baseline;gap:11px;min-width:0}   /* [260710 운영자 플그 확정] 이름↔D-day 8→11 */
.srail-name{flex:0 1 auto;min-width:0;font-size:16.5px;font-weight:800;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}   /* [260710 선택값] 15→16.5 · [260711 운영자] 공연 이름 볼드 복원(400→800) — 이름+핵심지표만 강조 */
.srail-dday{font-size:13.5px;font-weight:400;flex-shrink:0;font-variant-numeric:tabular-nums}   /* 10.5→13.5 */
.srail-meta{font-size:12.5px;color:var(--neutral-text);font-weight:500;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}   /* 11.5→12.5 · [260711 운영자] 제목↔메타 간격 1px→6px(확실히 벌리기 — 붙어 보임 해소) */
.srail-r2{display:flex;align-items:baseline;gap:8px;margin-top:7px}
.srail-occ{font-size:26px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}   /* [260710 선택값] 22→26 · [260711 운영자] 점유율 수치 볼드 복원(400→800) — 카드 핵심 지표 강조 */
.srail-delta{font-size:11.5px;font-weight:400;font-variant-numeric:tabular-nums;white-space:nowrap}
.srail-delta.up{color:var(--green)}
.srail-delta.dn{color:var(--danger)}
.srail-delta.fl{color:var(--dim)}
.srail-spark{margin-top:7px}
.srail-spark svg{display:block;width:100%;height:34px}
/* 판매 차트 범례(운영자 260710) — 차트 아래 2열 띠 · 색 전부 :root 토큰 계승(새 색 0) */
/* 범례 = 헤더 아래 고정 밴드 1개(운영자 260710 — 카드 반복 제거·한 줄·스크롤 밖) */
.srail-leg{flex-shrink:0;display:flex;align-items:center;gap:14px;padding:7px 16px;border-bottom:1px solid rgba(0,0,0,.07);overflow:hidden}
.srail-leg-i{display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:10.5px;color:var(--neutral-text);font-weight:600;font-variant-numeric:tabular-nums}
.srail-leg-i .d{flex:none;width:9px;height:9px;border-radius:50%;display:inline-block}
.srail-leg-i .n{color:var(--green);font-weight:400;font-size:11.5px}
.srail-bar{position:relative;height:5px;border-radius:999px;background:var(--past-bg);margin-top:8px}   /* [260710 운영자 선택값] 3→5 */
.srail-bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--green)}   /* [260710 운영자] 목표 눈금(.srail-bar>b) 삭제 — 렌더부(_srailCard)와 세트 */
.srail-r3{display:flex;justify-content:space-between;gap:8px;margin-top:7px;font-size:10.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.srail-r3 .tgt.ok{color:var(--green)}
.srail-r3 .tgt.bad{color:var(--danger)}
.srail-hd{display:flex;align-items:flex-start;gap:13px}
.srail-tt{flex:1;min-width:0}
/* 점유율 = 헤더 아래 줄(운영자 260710 확정 — 우측 열 폐지). 좌 여백 16 = .srail-hd 좌패딩과 정렬 */
.srail-occrow{display:flex;align-items:baseline;gap:8px;margin:8px 0 0}   /* [260710 운영자] 메타↔수치줄 1.3배(6→8) — 22.0% 라인박스로 붙어 보임 해소 */
.srail-seatsub{font-size:11.5px;color:var(--dim);font-weight:600}   /* [260710 운영자] 카드 숫자 폰트 통일 — 기준 = 어제대비(.srail-delta) 11.5px */
.srail-occcap{font-size:11.5px;color:var(--dim);font-weight:400}   /* [260710 운영자] 〃 (점유율/달성률 캡션) */
.srail-fc{font-size:11.5px;color:var(--text);font-weight:400;margin-top:7px;background:rgba(74,77,231,.03);border:1px solid rgba(74,77,231,.04);border-radius:9px;padding:10px 11px;line-height:1.5}   /* [260710 운영자 선택값] bg .04→.03 · bd .10→.04 · pad 5/9→10/11 · [260711] 기본 글자=--text(검정), 강조만 --accent(.srail-fc b) */
.srail-fc b{color:var(--fc,var(--accent));font-weight:700;margin-right:3px}   /* [260729 운영자] 라벨·픽토 색 = 그 프로그램 분야의 시그니처 색(판매현황 구분자 --gtok와 같은 축) · 미지정이면 종전 --accent */   /* [260714 운영자] AI 예상 라벨 = 볼드(700) 복귀 + 우측 내용과 간격 2배(공백+margin-right 3px ≈ 6px) · 구 260711 「볼드 해제」 되돌림 */
.srail-ai-ico{animation:srailAiGlow 1.9s ease-in-out infinite}   /* [260714 운영자] AI 예상 픽토그램 = 계속 빛나는 반짝임(강조색 글로우 펄스) */
/* [260731 운영자] 구 drop-shadow 글로우(0→2.6px 블러) 폐지 — 픽토 획 밖으로 색이 번져 테두리가 지저분했다.
   → 번짐 0의 **음영(명암) 펄스**: 불투명도만 오르내려 픽토 자체가 밝아졌다 어두워진다. 색·타이밍(1.9s)·감속선호 정지는 그대로. */
@keyframes srailAiGlow{0%,100%{opacity:.45}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.srail-ai-ico{animation:none;opacity:1}}   /* [260714] 감속선호 = 글로우 정지(정의 뒤에 둬야 오버라이드 승) */
.srail-ft{padding:8px 16px 12px;display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-shrink:0}
.srail-note{font-size:10px;color:var(--muted);line-height:1.4;flex:1}
/* 레일 캐러셀 — 판매중 공연 1장씩(버튼·점·드래그 넘김 + 유휴 자동넘김). 색·모션 전부 토큰 계승, 신규 raw hex 0. */
.srail-carousel{display:flex;flex-direction:column;height:100%;min-height:0}
.srail-vp{flex:1;min-height:0;overflow:hidden;position:relative;touch-action:pan-y}
.srail-track{display:flex;height:100%;will-change:transform;transition:transform .4s cubic-bezier(.55,0,.45,1)}
.srail-track.srail-drag{transition:none}
.srail-slide{flex:0 0 100%;min-width:0;overflow-y:auto;padding:0 2px}
.srail-cnav{display:flex;align-items:center;justify-content:center;gap:10px;padding:7px 6px 2px;flex-shrink:0}
/* [260714 운영자 선택값] 좌우 넘김 버튼 = 카드(.srail) 라인에서 안쪽 7px·세로 38%에 떠 있는 원형(플레이그라운드 확정). .srail overflow:hidden이라 안쪽 배치 = 클립 무관. 색 전부 토큰·그림자는 --text(rgb 26,26,46) alpha 변주 */
.srail-cbtn{position:absolute;z-index:6;top:38%;transform:translateY(-50%);width:24px;height:24px;border-radius:999px;border:1px solid var(--glass-bd);background:var(--glass-surface);color:var(--accent);font-size:14px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;padding:0;box-shadow:0 2px 8px rgba(26,26,46,.12);transition:border-color .15s,background .15s}
.srail-cbtn:hover{border-color:var(--accent);background:var(--accent-light)}
.srail-cbtn.prev{left:7px}
.srail-cbtn.next{right:7px}
.srail-dots{display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:center;align-self:center;margin-bottom:26px}
.srail-dot{width:6px;height:6px;border-radius:999px;background:var(--muted);border:none;padding:0;cursor:pointer;transition:background .2s,width .2s}
.srail-dot.on{background:var(--accent);width:16px}
/* AI 분석 섹션 — 드릴 컨설팅 줄 개편(운영자 260710: 강조색+AI 스파클 픽토그램 헤더 · [관점] 블릿 · 관점마다 끝이 살짝 열린 구분선 · 줄간격 유지). 색 전부 토큰. */
/* 운영자 260710 후속: AI 분석·액션 줄 = 위 차트 창과 같은 흰 구획 카드(.srail-chart 미러) 안에 — 콘텐츠가 유리 바탕에 떠 보이던 것 정리 + 드릴 맨 아래 마진 */
.sr-ai-card{border:1px solid var(--border);border-radius:var(--r-btn);background:var(--surface-solid);padding:8px 12px 10px;margin:8px 0}
.sr-ai-card .sr-ai-hd{margin-top:2px}
.srail-drill{padding:0 18px 16px}   /* [260724 운영자] 좌우 18 = 판매현황 표 마진과 동일 — 사업 상세가 가장자리에 붙던 것 해소 */
.sr-ai-hd{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;color:var(--accent);margin:10px 0 3px}
.sr-ai-item{display:flex;align-items:flex-start;gap:7px;font-size:11.5px;line-height:1.55;margin:6px 0 4px;color:var(--text)}   /* [260710 운영자] 위6/아래4 비대칭 — 한글 글리프가 라인박스 상단에 그려져 구분선 사이에서 위로 쏠려 보이던 것 시각 중앙 보정(박스 간격 5/5는 실측 대칭이었음) */
.sr-ai-item .bu{width:5px;height:5px;border-radius:999px;flex-shrink:0;margin-top:6px;background:var(--accent)}
.sr-ai-item b{font-weight:800}
.sr-ai-div{height:1px;background:var(--border);width:calc(100% - 28px);margin:2px 0}
/* 레일 인라인 드릴(개별 분석 — 분석 보드 드릴 계승, 캘린더 안 가리고 레일 안에서 동작) */
.srail-drill{animation:srailIn .22s ease}
@keyframes srailIn{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.srail{animation:none}.srail-drill{animation:none}.srail-track{transition:none}}
.srail-dhd{display:flex;align-items:center;gap:8px;margin-bottom:8px;min-width:0}
.srail-dname{flex:1;min-width:0;font-size:13.5px;font-weight:800;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srail-chart{border:1px solid var(--border);border-radius:var(--r-btn);background:var(--surface-solid);padding:6px 4px 2px;margin:8px 0}
.srail-chart svg{display:block;width:100%;height:auto}
.srail .ana-kpis{gap:8px;margin-bottom:8px}
.srail .ana-kpi{min-width:calc(50% - 4px);padding:9px 11px}
.srail .ana-kpi .val{font-size:17px}
.srail .ana-line{font-size:11.5px;margin:4px 0}
/* ===== [260723 운영자] 메인 = 사업 실적 · 캘린더 = 서브(토글) — .mv-seg = .fbar-seg 시각언어의 nav 흰 변형 + #app.biz-mode 표시 스위치.
   로직 무수정 원칙: 캘린더·레일 DOM은 그대로 두고 클래스로 표시만 전환(캘린더 렌더·필터·패널·펫 로직 불변). 색 전부 토큰·흰/흑 알파 변주 — 신규 raw hex 0. */
/* [260723 운영자] 메인 전환 토글 = 중앙 nav 대메뉴로 통일(구 좌측 .mv-seg 분리 토글 폐지) — 「대시보드|캘린더」 = MENUS 1·2번 · 표시/활성/호버 = 일반 .nav-btn 계승(별도 스타일 없음). 전환 = setMainView(클릭) · 활성 = _mvSync가 .nav-btn.on 동기 */
/* [260723 운영자 선택값] 실적 모드 레이아웃 = 좌우 1:1 · 바깥 20 · 상단 18 · 간격 15 · 우 유리 .35/blur15 · 라운드 20(--radius-lg) — 캘린더 모드는 현행 그대로 */
/* [260723e] 레이아웃·유리 선택값은 두 모드 공통으로 승격(위 기본 규칙에 반영) — biz 전용 스코프 잔여분만 아래 유지 */
#biz-main{display:none}
#app.biz-mode #chips,#app.biz-mode #cal-head-wrap,#app.biz-mode #cal,#app.biz-mode .pet,#app.biz-mode .crablane{display:none}
#chips{display:none}   /* [260723 운영자] 깔때기 필터 = 판매현황 레일 우상단(chips-rail)으로 이동 → biz(실적) 모드에선 이 요일바 #chips 숨김(연간실적 헤더 겹침 해소) */
#app:not(.biz-mode) #chips{display:flex}   /* [260731 운영자 복원] 캘린더 모드 = 레일 숨김(아래) → 깔때기 필터는 다시 요일바 우측(구 260723 이전 자리)이 주 위치. 뷰포트 분기 폐지(데스크탑도 노출) — 레일 안 chips-rail은 biz 모드 전용으로 잔존 */
#app.biz-mode #biz-main{display:block}
#app.biz-mode #sales-rail .srail-leg{display:none}   /* 범례 = 카드 차트 전용 — 표 모드에선 숨김 */
#app.biz-mode .nav-mnav{opacity:.82;pointer-events:none}   /* 월 네비 = 캘린더 축 — 클릭 차단(pointer-events:none 유지 = [260723 평의회3] 유령 월변경 방지) · 딤 .45→.82(운영자 260723 "7 2026 밝게") */
#sales-rail{transition:opacity .25s ease}
@media(max-width:1200px){#sales-rail{display:none}}
/* [260731 운영자] 캘린더 모드 = 판매 레일 없음 — 「캘린더 누를 때 사업 판매현황이 있을 필요가 없다」.
   260708 판매 레일 도입(PR 139) 이전 화면 복원: 캘린더가 전체 폭을 쓰고, 날짜 클릭 시 우측 360px 사이드바(#panel)가 살아나며 캘린더가 그만큼 밀린다(_panelRailReflow).
   레일 마크업·데이터·렌더러(.srail/#srail-uha/#rail-yrm)는 전부 보존 — biz(대시보드) 모드에선 그대로 노출되고, 판매현황 전체 보드는 nav 「판매 현황」이 담당. */
#app:not(.biz-mode) #sales-rail{display:none}
/* ===== [260723f Opus] 사업 실적 좌 보드 — 촤르륵 책장 넘김 + 글래스 정본 수려화(팔레트 폐쇄·토큰/흰알파만·신규 hex 0) ===== */
@keyframes bizPageR{from{opacity:0;transform:translateX(38px)}to{opacity:1;transform:none}}   /* › 다음 면 = 우→중앙(오른쪽에서 넘어옴) */
@keyframes bizPageL{from{opacity:0;transform:translateX(-38px)}to{opacity:1;transform:none}}   /* ‹ 이전 면 = 좌→중앙 */
.bizm-page{animation:bizPageR .42s cubic-bezier(.22,.61,.36,1)}   /* 촤르륵 = 감속 이징(책장 넘어와 안착) */
.bizm-page.rev{animation-name:bizPageL}
@media (prefers-reduced-motion:reduce){.bizm-page{animation:none}}
/* [260801 운영자] 책넘김 결 교체 — 통째로 미끄러지던 것(.bizm-page)을 「겉 유리 프레임은 제자리 · 그 안 내용만 촤르르」로.
   운영자 지시: "촤르르 대체하면서 현재 면의 내용 영역(뒤에 블러 깔린 부분)은 유지, 본인 내용이 나왔으면".
   붙는 곳 = 글래스 헤더([data-bizmhead])와 유리박스([data-bizmbox]) — 프레임은 안 움직이고 그 자식(제목·카드)만 움직인다.
   overflow:hidden = 넘어오는 내용이 프레임 밖으로 새지 않게(넘김 동안만 · _bizmAnimate가 끝나면 클래스 제거 = 팝오버·스크롤 원복).
   키프레임·이징 100% 계승(bizPageR/L · 신규 값 0). */
.bizm-flip{overflow:hidden}
.bizm-flip>*{animation:bizPageR .42s cubic-bezier(.22,.61,.36,1)}
.bizm-flip.rev>*{animation-name:bizPageL}
@media (prefers-reduced-motion:reduce){.bizm-flip>*{animation:none}}
/* [260723 운영자] 메인 토글(홍보 캘린더 ↔ 연간 실적) 촤르륵 슬라이드 — 좌측 콘텐츠만 이동, 우측 판매현황 레일은 고정. bizPage 키프레임 계승 */
.mv-swipe{animation:bizPageR .42s cubic-bezier(.22,.61,.36,1)}
.mv-swipe.rev{animation-name:bizPageL}
@media (prefers-reduced-motion:reduce){.mv-swipe{animation:none}}
/* 페이지 컨트롤(헤더 우측 embed) = ‹ • • › — 판매레일 dots·글래스 미니버튼 시각언어 계승 */
.bizm-pgctl{display:inline-flex;align-items:center;gap:9px}
.bizm-pgctl .nav{width:26px;height:26px;border-radius:var(--r-btn);border:1.5px solid var(--glass-bd);background:var(--glass-surface);color:var(--text);font-size:15px;font-weight:700;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;box-shadow:var(--glass-shadow);transition:border-color .15s,color .15s,background .15s;font-family:inherit;padding:0}
.bizm-pgctl .nav:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}
.bizm-pgctl .dots{display:inline-flex;gap:6px;align-items:center}
.bizm-pgctl .dot{width:6px;height:6px;border-radius:999px;background:var(--muted);border:none;padding:0;cursor:pointer;transition:background .22s,width .22s}
.bizm-pgctl .dot.on{background:var(--peach-text);width:18px}   /* [260724 운영자] 활성 슬라이드 점 = 강조색2(살몬 --peach-text=--c2) · 기틀 semantic 토큰 계승(값 동일) */
/* KPI 카드 — 글래스 서피스 + 역할색 상단 액센트 바(중앙 정렬·마진 균일 · .pm-fbtn 글래스 톤 계승) */
.bizm-kpi{position:relative;flex:1;min-width:124px;padding:15px 16px 14px;background:var(--glass-surface);border:1px solid var(--glass-bd);border-radius:var(--radius);box-shadow:var(--glass-shadow);overflow:hidden}
.bizm-kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--kpitok,var(--accent))}
.bizm-kpi .lab{font-size:11px;color:var(--dim);font-weight:600;margin-bottom:7px;letter-spacing:-.01em}
.bizm-kpi .val{font-size:22px;font-weight:800;color:var(--kpitok,var(--accent));font-variant-numeric:tabular-nums;line-height:1.05}
.bizm-kpi .val .u{font-size:13px;font-weight:700}
/* 히어로 — 프리미엄 그라디언트(accent-glow→투명 알파변주) + 상단 흰 하이라이트 */
.bizm-hero{position:relative;display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px;padding:16px 20px;border-radius:var(--radius-lg);border:1px solid var(--accent-light);background:linear-gradient(135deg,var(--accent-glow) 0%,rgba(74,77,231,.03) 60%,rgba(216,132,85,.05) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),var(--glass-shadow)}
.bizm-hero .lb{font-size:12px;color:var(--neutral-text);font-weight:700;line-height:1.4}
.bizm-hero .lb .sub{font-weight:500;color:var(--dim);font-size:11px}
.bizm-hero .big{font-size:30px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1}
.bizm-hero .big .u{font-size:15px;font-weight:700;margin-left:3px}
.bizm-hero .brk{font-size:11px;color:var(--dim);margin-left:auto;white-space:nowrap;line-height:1.5}
/* 차트/표 구획 = 흰 서피스 카드 통일(라운드·보더·여백 균일) */
.bizm-card{border:1px solid var(--border);border-radius:var(--radius);background:var(--surface-solid);box-shadow:0 2px 10px rgba(74,77,231,.04);margin-bottom:14px;overflow:hidden}
[data-bizmbox] .bizm-card:last-child{margin-bottom:0}   /* [260731 평의회 구역1 M2] 유리박스 안 마지막 카드 바깥 여백 제거 — 박스 내부 상 18 vs 하 33 비대칭 해소 · 좌(#biz-main)·우(#rail-yrm) 공통 적용해야 두 박스 하단선 계약(Δ0)이 유지된다(#srail-uha L1936 동형 규칙의 일반화) */
.bizm-card .ct{font-size:13px;font-weight:700;color:var(--text);padding:12px 14px 2px;letter-spacing:-.01em}
.bizm-card .ct .sub{font-weight:400;color:var(--dim);font-size:11px;margin-left:8px}   /* [260724 운영자] 제목↔설명 간격 확대(연도별 관람추이 옆 설명글) */
/* [260729 운영자] 카드 제목 블릿 — 지목 3곳(연도별 관람·수강 추이 · 전체 실적표 · 프로그램 별 판매 추이)에만 붙는 부품.
   값 = 4×14 · r2 · 강조색1 --accent(구 출처 = 분야 헤더 표식이었으나 260729 그쪽이 원형 블릿 .ry-grp-hd::before L2119로 갈렸다 — 이 막대는 카드 제목 전용 정본). 배치만 inline-block(::before는 flex 헤더에서 아이템이 되어 space-between을 깨므로 마크업 span). */
.ct-bul{display:inline-block;width:4px;height:14px;border-radius:2px;background:var(--accent);vertical-align:-2px;margin-right:8px;flex-shrink:0}
.bizm-card .pad{padding:8px 10px 4px}
/* 섹션 소제목 = accent 바 프리픽스(.ana-cat-hd 계승) */
.bizm-sec{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--text);margin:14px 2px 12px}   /* [260725 운영자] 상하 여백 확보 — 상 2→14(형제 기준값 .bizm-card/.bizm-strip margin-bottom 14 계승) · 하 10→12 */
.bizm-sec::before{content:'';width:4px;height:14px;border-radius:2px;background:var(--accent)}
/* [260723g 운영자 시안] 블러는 패널 프레임에만 · 글자 빼곡한 내부 = 메인 팔레트 흰색(--surface-solid) 불투명 = 크리스프 가독 */
#app.biz-mode #sales-rail .srail{background:rgba(255,255,255,.55)}   /* 우 패널 = 블러 유지 + 흰색 상향(텍스트 가독) — 선택값 .35 supersede(시안 반영) */
#app.biz-mode #sales-rail #srail-uha{background:rgba(255,255,255,.55)}   /* [260724] 우하단 상세 = .srail과 동일 흰색 상향(가독) · 노출(display)은 _srailUhaSync가 데이터 있을 때만 inline flex — 빈 박스 깜빡임 방지(캘린더 모드·데이터 0 = display:none) */
#app.biz-mode #biz-main .bizm-box{background:rgba(255,255,255,.55)}   /* 좌 프레임도 동일 */
/* [260724 운영자] 연간 실적 틀 우측 이식(1단계) — #rail-yrm = biz 모드에서만 노출(좌 연간실적 통 그대로 계승). 기존 판매현황(.srail)·우하단(#srail-uha)·타이틀존은 이 단계에서 가림(코드·데이터 보존 · 운영자 "우측 내용은 그 위에 이식할거니까 대기"). 신규 hex·토큰 0(부품·white alpha 계승). */
#rail-yrm{display:none}
#app.biz-mode #sales-rail #rail-yrm{display:block}
#app.biz-mode #sales-rail>.srail-ttlzone,#app.biz-mode #sales-rail>.srail{display:none !important}
/* [260724 운영자] 레이아웃 합침 — 상세(#srail-uha) = 연간실적 틀(_BIZM_BOX) 안 슬롯(#rail-yrm-uha)으로 이주(한 통). 자체 유리박스 탈피(배경·보더·그림자·라운드 해제 — 글래스 헤더·내부 카드 부품은 유지) · 노출은 종전대로 _srailUhaSync(데이터 있을 때만 flex) */
#app.biz-mode #sales-rail #rail-yrm #srail-uha{margin-top:14px;background:transparent;backdrop-filter:none;-webkit-backdrop-filter:none;border:none;border-radius:0;box-shadow:none;min-height:0;flex:none;animation:none}
/* 선택 행 액티브 — 2×2에 지금 떠 있는 프로그램 표시(기틀 .cell 액티브 톤 계승: accent-light 배경 + 좌측 강조 바) */
#rail-yrm-list tr.clk{cursor:pointer}
/* [260725 운영자] 액티브 행 = 즉시 점프 → 슬라이드. 문법 100% 계승 = 상단 nav 호버 pill(.nav-hover-bg, L225) — top/left/width/height 전이 + is-instant 첫 등장 제자리 페이드.
   [260725 운영자] 음영 톤 = 「위에 있는 옅은 색」 기준 = 행 호버 배경 rgba(74,77,231,0.045)(.ana-tbl tbody tr.clk:hover, L1666) 그대로 계승.
   구 --accent-light는 자동 순환이 지나갈 때마다 표가 확 어두워져 과했다 → 옅은 톤으로 낮추고, 자동 선택 구분은 좌변 3px --accent가 담당. */
#rail-yrm-list .ry-hl{position:absolute;left:0;right:0;top:0;z-index:0;opacity:0;pointer-events:none;background:rgba(74,77,231,0.045);box-shadow:inset 3px 0 0 var(--accent);transition:top .22s cubic-bezier(.215,.61,.355,1),height .22s cubic-bezier(.215,.61,.355,1),opacity .15s ease}   /* 가로 = 리스트 좌우 패딩(12)과 동치 = 표 좌우변. JS로 재는 순간 타이밍에 따라 짧게 잡히는 사례가 있어 CSS로 고정 */
#rail-yrm-list .ry-hl.is-instant{transition:opacity .15s ease}
#rail-yrm-list .ry-hl.is-visible{opacity:1}
#rail-yrm-list .ana-tbl,#rail-yrm-list .bizm-sec{position:relative;z-index:1}
@media (prefers-reduced-motion:reduce){#rail-yrm-list .ry-hl{transition:opacity .15s ease}}
/* [260724 운영자] 2단계 — 판매·진행중 공연·전시 블릿 리스트(KPI 4칸 아래) · 넘치면 기틀 오버레이 스크롤(.srail-body/.srail-uha-body 계승: 평소 width:0 콘텐츠 꽉 + 호버 8px 리빌 · 썸 흑알파 .15). 색 = 표 카테고리색(공연 --accent·전시 --peach-text)·중립 토큰만(신규 hex 0). */
/* [260725 운영자] 분야(공연·전시·교육)를 각각 '투명 네모'로 나누고 그 안에서만 스크롤 — 바깥은 스크롤 없음(높이는 _srailAlignTop이 좌 실적표에 맞춰 고정).
   [260725 운영자] 「분리 안 되게」 = 네모의 보더·반경·사이 간격 폐지 → 카드 한 통 안에서 분야 머리글로만 나뉜다(구획선 0).
   내부 스크롤·높이 배분(flex)·정렬(날짜 가까운순)은 그대로 — 시각 분리만 걷어냈다. */
#rail-yrm-list{position:relative;overflow:hidden;min-height:0;padding:6px 12px 14px;display:flex;flex-direction:column;gap:0}
.ry-grp{flex:0 0 auto;display:flex;flex-direction:column;min-height:0;background:transparent;border:none;border-radius:0;overflow:hidden}
.ry-grp-hd{flex-shrink:0;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--text);padding:14px 12px 8px}   /* 상 10→14 = 위 분야 표와 붙은 뒤의 숨돌림(형제 .bizm-sec margin-top 14 계승) */
.ry-grp:first-child .ry-grp-hd{padding-top:10px}
/* [260729 운영자] 분야 표식 = 세로 막대 → 원형 블릿(운영자 지목 = 공연·전시 머리글 앞 표식 · "색상은 유지"). 카드 제목 블릿(.ct-bul 막대)과 모양이 갈려 대분류(카드)↔중분류(분야) 위계가 보인다.
   값 100% 계승 = 정본 컴포넌트 6번 칩의 점 부품 .chip-dot(L658 — 8×8 · r50%) · flex-shrink:0은 .ct-bul 계승(flex 헤더에서 찌그러짐 방지) · 색 = 종전 --gtok 그대로(공연 --accent · 전시 --peach-text). 신규 hex·px 0 */
.ry-grp-hd::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--gtok,var(--accent));flex-shrink:0}
.ry-grp-bd{position:relative;flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;-ms-overflow-style:none;scrollbar-color:transparent transparent;scrollbar-gutter:stable}   /* [260731 운영자 4차 · 픽셀실측] gutter 상시 확보 — 스크롤 생긴 그룹만 표 폭이 7px 깎여 공연↔전시 열 세로선이 어긋나던 것(실측 Δ≈7px) 해소. 전 그룹 동일 폭 = 열 경계 Δ0 */
.ry-grp-bd::-webkit-scrollbar{width:7px;height:0;background:transparent}
#rail-yrm:hover .ry-grp-bd{scrollbar-color:rgba(0,0,0,0.075) transparent}   /* [260729 운영자] 호버 리빌 투명도 50% — 진행 중인 프로그램 표 가로 스크롤바가 분야 사이를 가로지르며 도드라져 절반으로(0.15→0.075 · 흑알파 변주) */
#rail-yrm:hover .ry-grp-bd::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.075)}
.ry-grp-bd::-webkit-scrollbar-thumb{background:transparent;border:0;border-radius:999px}
.ry-grp-bd::-webkit-scrollbar-track{background:transparent;border:none;margin:0}
#rail-yrm-list::-webkit-scrollbar{width:7px;height:0;background:transparent}
#rail-yrm:hover #rail-yrm-list{scrollbar-color:rgba(0,0,0,0.15) transparent}
#rail-yrm:hover #rail-yrm-list::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.15)}
#rail-yrm-list::-webkit-scrollbar-thumb{background:transparent;border:0;border-radius:999px}

  if(els.sum)els.sum.style.display='none';   // 드릴 중엔 목록 요약 대신 개별 지표
  var ax=_anaProfitAxis(p['수익성']);
  var occ=p.occ, dpp=p.deltaPP, tgt=p.목표||50, gap=occ-tgt, noData=!!p.noData;
  // 어제대비 (분석 보드 드릴과 동일 임계·표기)
  var dStr,dCol;
  if(dpp===null){dStr='수집 전';dCol='var(--dim)';}
  else if(dpp>0.04){dStr='▲ +'+dpp.toFixed(1)+'%p';dCol='var(--green)';}
  else if(dpp<-0.04){dStr='▼ '+dpp.toFixed(1)+'%p';dCol='var(--danger)';}
  else {dStr='보합';dCol='var(--dim)';}
  var ddTxt=_salesDdayStr(p.dday)||'-';
  // 또래 비교(같은 축·장르 종료공연, 표본<3이면 축 전체) — 분석 보드 드릴 로직 계승
  var peersG=_anaPeers(p,true), peers=peersG.length>=3?peersG:_anaPeers(p,false);
  var peerOcc=peers.map(function(q){return q.occ;}).sort(function(a,b){return a-b;});
  var peerMed=peerOcc.length?peerOcc[Math.floor(peerOcc.length/2)]:null;
  var medTxt=(peerMed!==null)?('또래('+peers.length+'건) 중앙값 '+peerMed.toFixed(0)+'% 대비 '+(occ-peerMed>=0?'+':'')+(occ-peerMed).toFixed(0)+'%p'):'비교할 또래 종료공연 없음';
  // [260710 운영자] 액션 문구(「목표 대비 부진 …」 등) 제거 + [← 목록] = 판매 현황 nav바 우측으로 + [실적 수정][자세히 보기] = 드릴 우측 상단
  if(!(opts&&opts.noNav))_srailNavSlot('<button class="ana-back" style="margin-bottom:0;padding:4px 10px;font-size:11px" onclick="_srailBack()">← 목록</button>');
  var h='<div class="srail-drill">';
  h+='<div class="srail-dhd"><span class="srail-dname" title="'+escapeHtml(p.name)+'">'+escapeHtml(p.name)+'</span>'
    +'<span style="display:inline-flex;gap:6px;flex-shrink:0;margin-left:auto">'
    +((typeof userRole!=='undefined'&&userRole==='admin')?'<button class="ana-chip" onclick="_srailEditOpen(\''+_anaEsc(p.name)+'\')" title="이 공연의 일일입력 실적을 시트(DB)에서 불러와 수정 · 특정 날짜를 예측 계산에서 제외(관리자 전용)">실적 수정</button>':'')
    +((typeof userRole!=='undefined'&&userRole==='admin')?'<button class="ana-chip" onclick="_srailRoundsOpen(\''+_anaEsc(p._mid||'')+'\',\''+_anaEsc(p.name)+'\')" title="회차별 공연일·오픈 객석 입력 — 전 회차 입력이 충족되면 합산이 가용좌석(점유율 분모)이 됩니다(관리자 전용)">회차·객석</button>':'')
    +'<button class="ana-chip" onclick="_srailOpenBoard(\''+_anaEsc(p.name)+'\')" title="분석 보드에서 비슷한 공연 비교까지 자세히 보기">자세히 보기</button>'
    +'</span></div>';
  h+='<div class="srail-meta" style="margin-bottom:8px">'+escapeHtml((p.genre||'기타')+' · '+ax+' · 오픈석 '+p.totalOpen.toLocaleString()+'석'+(p._openSrc==='sum'?' (회차 합산)':(p._openSrc==='xN'?' (1회차×회차 보정)':''))+(p._roundsN?' · 회차 '+p._roundsN:(p._rcSrc==='span'?' · 회차 '+p._rcEst+' 추정(기간·미입력)':''))+(p.dateStr?' · '+p.dateStr:''))+'</div>';
  // [260731 운영자] 2면(페이지 접속통계) — 제목·부제 줄까지는 공통, 본문만 갈아끼운다. 우하단 자동전환(opts.noNav)은 1면 고정.
  var _pg=(opts&&opts.noNav)?1:_srailDrillPage();
  if(_pg===2){ els.body.innerHTML=h+_srailAccHtml(p)+_srailDrillDots()+'</div>'; return; }
  h+='<div class="ana-kpis">';
  h+='<div class="ana-kpi"><div class="lab">현재 누적 점유율</div><div class="val">'+(noData?'집계 전':occ.toFixed(1)+'%')+'</div></div>';
  h+='<div class="ana-kpi"><div class="lab">어제대비</div><div class="val" style="color:'+dCol+'">'+dStr+'</div></div>';
  h+='<div class="ana-kpi"><div class="lab">목표 / 차이</div><div class="val">'+tgt+'%</div>'+(noData?'':'<div class="sub2" style="color:'+(gap>=0?'var(--green)':'var(--danger)')+'">'+(gap>=0?'+':'')+gap.toFixed(1)+'%p</div>')+'</div>';
  h+='<div class="ana-kpi"><div class="lab">공연일</div><div class="val">'+ddTxt+'</div></div>';
  h+='</div>';
  h+='<div class="srail-chart">'+_srailDrillSvg(p)+'</div>';
  // [260710 운영자] AI 분석 + 액션 줄 = 위 차트 창과 같은 흰 구획 카드 안(유리 바탕에 떠 보이던 것 정리)
  h+='<div class="sr-ai-card">';
  h+=_srailAiHd();
  h+=(noData
    ?_srailAiRow('var(--dim)','상황','판매 실적 집계 전 (티켓 오픈됨, 첫 일일입력 대기)')
    :_srailAiRow(gap>=0?'var(--green)':'var(--peach-text)','상황','목표 '+tgt+'% '+(gap>=0?'달성':'미달')+' ('+(gap>=0?'+':'')+gap.toFixed(1)+'%p) · '+medTxt));
  h+='<div class="sr-ai-div"></div>';
  h+=_srailAiRow('var(--accent)','효과 채널',_anaTopChannel(p.name));
  h+='<div class="sr-ai-div"></div>';
  h+=_srailAiRow('var(--accent)','최대 레버',_anaTopLever(_anaDailySeries(p)));
  h+='</div>';
  if(!(opts&&opts.noNav))h+=_srailDrillDots();   // [260731] 면 넘김(1 판매 현황 · 2 페이지 접속통계) — 자동전환 카드에는 미노출
  h+='</div>';
  els.body.innerHTML=h;
}
function _srailAccHtml(p){
  var a=_accOf(p&&p.name);
  if(!a)return '<div class="u-empty" style="padding:26px 8px"><div class="ico">📊</div><div class="msg">이 공연의 접속통계가 아직 없어요</div><div style="font-size:11px;color:var(--muted);margin-top:6px">예매 사이트 접속 통계에 집계되면 표시돼요</div></div>';
  var ageL=_accLabels('age'), regL=_accLabels('region');
  var ages=a.a||[], regs=a.g||[];
  var topAgeI=ages.reduce(function(bi,v,i){return v>ages[bi]?i:bi;},0);
  var inHouse=(regs[0]||0)+(regs[1]||0)+(regs[2]||0);   // 관내 = 여수·순천·광양 (고객 분석 관내 3시 기준과 동일)
  var cvr=(a.t>0&&p.seats!==null&&p.seats!==undefined&&!isNaN(p.seats))?(p.seats/a.t*100):null;
  var h='<div class="ana-kpis">';
  h+='<div class="ana-kpi"><div class="lab">총 접속수</div><div class="val">'+a.t.toLocaleString()+'</div><div class="sub2" style="color:var(--dim)">로그인 회원 기준</div></div>';
  h+='<div class="ana-kpi"><div class="lab">최다 연령대</div><div class="val" style="font-size:15px">'+escapeHtml(ageL[topAgeI]||'—')+'</div><div class="sub2" style="color:var(--dim)">'+(ages[topAgeI]||0).toFixed(1)+'%</div></div>';
  h+='<div class="ana-kpi"><div class="lab">관내 비중</div><div class="val">'+inHouse.toFixed(1)+'%</div><div class="sub2" style="color:var(--dim)">여수·순천·광양</div></div>';
  h+='<div class="ana-kpi"><div class="lab">접속 대비 구매</div><div class="val">'+(cvr===null?'—':cvr.toFixed(1)+'%')+'</div><div class="sub2" style="color:var(--dim)">'+(cvr===null?'집계 전':'판매 '+Math.round(p.seats).toLocaleString()+'석 ÷ 접속')+'</div></div>';
  h+='</div>';
  h+='<div class="srail-chart" style="padding:11px 13px 9px">'+_accDist('연령대 분포','(접속 회원 비율)',ages,ageL)+'</div>';
  h+='<div class="srail-chart" style="padding:11px 13px 9px">'+_accDist('지역 분포','(접속 회원 거주지 비율)',regs,regL)+'</div>';
  h+='<div class="srail-note" style="padding:2px 2px 0;color:var(--muted);font-size:11px">'+escapeHtml('공연별 페이지 접속 통계'+(a.v?' · '+a.v:'')+(a.c?' · '+a.c:'')+((typeof PERF_ACCESS_STATS!=='undefined'&&PERF_ACCESS_STATS.asof)?' · 기준 '+PERF_ACCESS_STATS.asof:''))+'</div>';
  return h;
}
function _accDist(title,sub,vals,labels){
  var max=vals.length?Math.max.apply(null,vals):0;
  var rank=vals.map(function(v,i){return [v,i];}).sort(function(a,b){return b[0]-a[0];}).slice(0,2).map(function(x){return x[1];});
  return '<div style="font-size:12.5px;font-weight:800;margin:0 0 4px">'+escapeHtml(title)+' <span style="font-size:10.5px;color:var(--dim);font-weight:500">'+escapeHtml(sub||'')+'</span></div>'
    +labels.map(function(l,i){ return _accBar(l,vals[i]||0,max,rank.indexOf(i)>=0); }).join('');
}
function _accBar(label,pct,max,hi){
  var w=max>0?Math.max(2,pct/max*100):0;
  return '<div style="display:flex;align-items:center;gap:9px;margin:7px 0"><div style="flex:0 0 66px;font-size:11.5px;font-weight:600;color:var(--text);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+escapeHtml(label)+'</div>'
    +'<div style="flex:1;height:15px;background:var(--past-bg);border-radius:3.5px;overflow:hidden"><div style="width:'+w.toFixed(1)+'%;height:100%;background:'+(hi?'var(--accent);opacity:.79':'var(--peach-text);opacity:.5')+';border-radius:3.5px"></div></div>'
    +'<div style="flex:0 0 46px;font-size:11px;color:var(--dim);text-align:left;font-variant-numeric:tabular-nums">'+pct.toFixed(1)+'%</div></div>';
}
function _accIdx(){
  if(_ACC_IDX)return _ACC_IDX;
  var m={},rs=((typeof PERF_ACCESS_STATS!=='undefined'&&PERF_ACCESS_STATS&&PERF_ACCESS_STATS.rows)||[]);
  rs.forEach(function(r){ var k=_uName(r.n); if(!k)return; var cur=m[k]; if(!cur||(r.t||0)>(cur.t||0))m[k]=r; });   // 동명 중복 행 = 접속수 큰 쪽 채택
  _ACC_IDX=m; return m;
}
function _accOf(name){ if(!name)return null; return _accIdx()[_uName(name)]||null; }
function _accLabels(key){ var S=(typeof PERF_ACCESS_STATS!=='undefined'&&PERF_ACCESS_STATS)||{}; return (key==='age'?S.ageLabels:S.regionLabels)||[]; }
function _srailDrillDots(){
  var cur=_srailDrillPage(), dots='';
  for(var i=1;i<=2;i++)dots+='<button class="dot'+(i===cur?' on':'')+'" type="button" aria-label="'+i+'면 '+_SRAIL_DPG_LBL[i-1]+'" aria-pressed="'+(i===cur)+'" onclick="_srailPageTo('+i+')"></button>';
  return '<div style="display:flex;justify-content:center;margin:12px 0 2px"><span class="bizm-pgctl" role="group" aria-label="공연 상세 책 넘김"><button class="nav" type="button" aria-label="이전 면" onclick="_srailPageGo(-1)">‹</button><span class="dots">'+dots+'</span><button class="nav" type="button" aria-label="다음 면" onclick="_srailPageGo(1)">›</button></span></div>';
}
function _srailDrillPage(){ var n=_srailView&&_srailView.page; return (n===2)?2:1; }
function _srailPageTo(n){ if(!_srailView||_srailView.mode!=='drill')return; _srailView.page=(n===2)?2:1; _srailRender(); }
function _srailPageGo(d){ _srailPageTo(_srailDrillPage()===1?2:1); }
function _uName(s){ return String(s||'').replace(/\s*[-–—]\s*여수\s*$/,'').replace(/[〈〉<>「」『』\[\]（）()]/g,'').replace(/[_\-–—·.,’'"~!:：]/g,'').replace(/\s+/g,'').toLowerCase(); }
_srailView.page=1;
_srailRenderDrill({body:document.getElementById('after1')},P,7);
_srailRenderDrill({body:document.getElementById('before')},P,7,{noNav:true});
_srailView.page=2;
_srailRenderDrill({body:document.getElementById('after2')},P,7);
</script>
