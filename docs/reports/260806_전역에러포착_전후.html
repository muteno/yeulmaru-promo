<h1>전역 에러 포착 — 전/후 실측 (260806 · 운영자 선택 「관리자에게만 토스트」)</h1>
<p>같은 조작 = <b>onclick 핸들러가 예외를 던진다</b>(260806 위저드 사고와 같은 모양).
전 = 화면·콘솔 모두 우리 쪽 안내 0 → 「눌러도 아무 일도 안 일어남」이 사용자가 아는 전부였다.</p>
